      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Banner'}}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
    post:
      summary: 新建 Banner（**响应必须带 id**：前端用它打后续的 PUT /{id}）
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BannerInput'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Banner'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/banners/{id}:
    put:
      summary: 全量更新（整行覆盖）；id 不存在 → **40402**
      description: 🈲 不存在的 id **不得**返回 200——那会让运营以为改成功了、实际什么都没改（静默失败）。DELETE 则相反：幂等 204
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/BannerInput'}, {type: object, required: [expected_updated_at], properties: {expected_updated_at: {type: string, format: date-time, description: '0.6.30：乐观锁凭据（管理端列表回显的 updated_at）；对不上 → 409 / 40914'}}}]}}}}
      responses: {'200': {description: 'OK（无响应体）'}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
    delete:
      summary: 删除（**幂等**：不存在的 id 也 204）
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Deleted}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/disputes:
    get:
      summary: 拒付列表（D-50）：payments.dispute_status；证据在 Stripe Dashboard 提交，后台只标红、锁退款、拉黑
      description: 0.6.5 补：只出**带 dispute_id 的支付行**（无拒付的支付行不出现）；按开案时间倒序（NULL 最后）。`status` 非法 → **40001**，🈲 不得静默当成"不过滤"——那会让运营看到列表突然变长、按"拒付激增"这个错的结论去查业务
      parameters: [{name: status, in: query, schema: {type: string, enum: [open, won, lost, withdrawn]}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Dispute'}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/users:
    get:
      summary: 已拉黑用户列表（0.6.36 / AJ-384；解除拉黑的入口）
      description: '目前只支持 blocked=true（其它取值 40001）。按拉黑时间倒序，最多 200 条。只给 id / 时刻 / 订单数，不给 openid 等身份字段。'
      parameters: [{name: blocked, in: query, required: true, schema: {type: string, enum: ['true']}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, required: [id, blocked_at, created_at, order_count], properties: {last_recipient: {type: string, description: '0.6.40：最近一单的收件人'}, last_contact_email: {type: string, description: '0.6.40：最近一单的联系邮箱'}, id: {type: string}, blocked_at: {type: string, format: date-time}, created_at: {type: string, format: date-time}, order_count: {type: integer}}}}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/users/{id}/unblock:
    post:
      summary: 解除拉黑（0.6.36 / AJ-384）
      description: '原因必填（进审计，改前值 blocked_at 记 before）；本来就没被拉黑 → 200 already_unblocked=true（幂等）；用户不存在 → 40403。只清 blocked_at，不动 token_ver（拉黑时旧 token 已失效，解除后重新登录）。拉黑时被连带取消的在途单不恢复。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 500}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [already_unblocked], properties: {already_unblocked: {type: boolean}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}}
  /admin/ops/sales-pause:
