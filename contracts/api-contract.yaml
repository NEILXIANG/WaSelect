      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {key: {type: string}, name: {type: string}, sort: {type: integer}, active: {type: boolean}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}}
