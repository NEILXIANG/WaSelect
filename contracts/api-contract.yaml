      @why 它同时是管理端列表的排序键：买家下一单就把商品顶到第 1 位，运营翻页时整体位移 → 漏行 + 重行（DB3-02）；
      而在 ① 之后，每次成交还会把运营正在进行的编辑判定为"被别人改过"（AJ-175 的
      "编辑期间下单仍能保存、不覆盖库存"就此失效）。库存是**实时余额**，不是商品信息。
      ⚠️ `PATCH /admin/products/{id}/status`（上下架）**仍然**刷新它：上下架是商品信息的一部分。
      ③ 新增错误码 **40914**（这个商品在你打开之后被别人改过了）。
