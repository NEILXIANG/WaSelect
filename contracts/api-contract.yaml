    AdminOrderListItem: {type: object, description: '0.6.26（D-39）：增 `items`（含采购快照的行项目）——「待采购清单」就是 `GET /admin/orders?status=paid` 这一页本身，行里必须有采购信息，否则采购员要逐单点开详情。固定下发，不随 status 参数变化（形状固定 > 省流量）。', properties: {order_id: {type: string}, order_no: {type: string}, user_id: {type: string}, status: {$ref: '#/components/schemas/OrderStatus'}, total_jpy: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/AdminOrderItem'}}, contact_email: {type: string}, carrier: {type: string}, tracking_no: {type: string}, tracking_url: {type: string, description: '0.6.32：官方查件链接（日本邮便 S10 单号或承运商为日本邮便时生成，locale=en）；认不出 → 整键省略'}, recipient: {type: string, description: '收件人姓名（0.6.9/KD-14）：列表支持按收件人搜索，行里要能回显；电话/街道等其余地址字段仍只在详情'}, has_dispute: {type: boolean, description: '列表也带（0.6.1）：客服在列表页就能看见拒付单'}, is_test: {type: boolean}, late_paid: {type: boolean, description: '0.6.31：有迟到付款凭据（已关单收到钱）；为 true 时 expired / cancelled 单可退款'}, after_sale_open: {type: boolean, description: '0.6.58：有进行中的售后申请（open / processing）'}, user_blocked: {type: boolean, description: '0.6.58：下单人已被拉黑'}, ship_overdue: {type: boolean, description: '0.6.70（AJ-484）：已付款且超过承诺的 N 个工作日仍未发货（同 attention=ship_overdue）；0.6.89 起不含拒付锁定的单'}, payment_dispute: {type: string, enum: [open, lost], description: '0.6.89：拒付进行中 / 已败诉（与买家 OrderListItem.payment_dispute 同一判据）；has_dispute 对两者都是 true。没有拒付或已解除 → 省略'}, created_at: {type: string, format: date-time}}}
