servers:
  - url: https://api.example.com/api/v1
security:
  - bearerAuth: []
x-error-codes:
  description: 业务错误码注册表（唯一真源 = 技术文档 v0.5 §7）；码前三位即 HTTP 状态。packages/shared/src/errors.ts 必须与本表一致，由 scripts/check-contract.mjs 防漂移。
  codes:
    40001: 参数缺失或格式错误
    40002: 地址须为英文/拼音或电话格式错误
    40011: 条款版本缺失或已过期
    40101: 未登录或登录已过期
    40102: 支付链接无效或已失效
    40103: 回调验签失败（D6：入站方问题，4xx，不占 5xx 通道）
    40301: 无权限
    40400: 请求的资源不存在（含他人资源：订单 / 地址按归属判定，与不存在同码防探测；未知路径也归此码）
    40402: 该 Banner 不存在或已被删除
    40403: 该用户不存在
    40404: 该分类不存在或已被删除（0.6.74：PUT / DELETE /admin/categories/{key}）
    40401: 商品不存在或已下架
    40901: 库存不足
    40902: 订单状态不允许此操作
    40903: 重复提交
    40904: 订单已过期
    40905: 价格已变动
    40906: 订单金额超过上限，请拆单
    40907: 该支付存在未解除的拒付限制（进行中，或已败诉），暂不可退款
    40908: 幂等键复用但请求内容不一致（D4：客户端须为每次新意图生成新键）
    40909: 该支付存在未解除的拒付限制（进行中，或已败诉），暂不可发货（与 40907 同一事实的两个消费方：退款用 40907、发货用 40909）
    40910: 该币种在此生效时间已有一条汇率
    40911: 不能拉黑管理员账号
    40912: 包裹超过可配送的重量上限，请拆单（0.6.16：有运费表但超过最大一档；运费表缺失仍是 50004）
    40913: 未付款的订单太多了，请先完成支付或取消后再下单（0.6.16：每用户在途单上限）
    40914: 这条内容在你打开之后被别人改过了（0.6.18：PUT /admin/products/{id} 的乐观锁冲突；0.6.30 起 PUT /admin/banners/{id} 同用；0.6.46 起 PATCH /admin/products/{id}/stock 的库存凭据冲突同用；整行未写，前端须保留表单并提示刷新后对照最新值再保存）
    40916: 店铺暂停接单，请稍后再来（0.6.36：全局停售开关打开时，报价 / 建单 / 发起支付返回本码；回调、退款、发货不受影响）
    40917: 收货地址已达上限（20 个），请先删除不用的地址（0.6.36：POST /addresses）
    40918: 运费表最高档装不下这件商品（含包材重量）（0.6.43：改在售商品、上架（0.6.46 起含草稿上架；新建是草稿、不再判）、整表替换运费表；换表时 data.product_id 指出是哪件）
    40919: 这个分类下还有商品，不能删除（0.6.74：DELETE /admin/categories/{key}）
    41301: 提交的内容太大（0.6.69：请求体超过大小上限；此前折成 40001）
    40915: 这张订单不属于你要拉黑的这个用户（0.6.21：POST /admin/users/{id}/block 带了 order_id 但归属核对不过；整条请求未写）
    42901: 请求过于频繁
    50000: 服务器内部错误
    50001: 支付创建失败
    50003: 汇率不可用
    50004: 运费不可计算
    50300: 服务暂时不可用（上游熔断打开，按 data.retry_after_ms 退避）
x-payment-channels:
  description: |
    **当前登记在册**的支付通道 key（D-56 / D-59）。
    ① 这是**登记表，不是枚举约束**：本契约所有 schema 里的 channel 字段一律 `type: string`——
       新增支付方式只需在注册表与配置里加一条，**不需要改本契约、也不需要新增路由**
       （`/pay/callback/{channel}` 的 channel 是路径参数，`GET /pay/channels` 返回可选项）。
       把它写成 OpenAPI `enum` 等于宣布"每加一个通道都要发一版契约"，与 D-56 直接冲突。
    ② 它是**机器可读**的：`scripts/check-contract.mjs` 取这里的 `keys`，与
       `packages/shared/src/enums.ts` 的 `PAYMENT_CHANNEL` 做**双向集合比对**——
       只在 shared 加了通道而契约没登记（或反之）都会在 gate 里报红。
       @limitation 它守的是"两端登记一致"，**守不住"登记了但适配器没装配"**（那是装配层的事）。
    ③ 不在表内的 key：建单路径 40001（`POST /orders/{id}/pay`）、回调路径 40001（`/pay/callback/{channel}`）。
  keys: [mock, wechat, stripe]
paths:
  /auth/wechat/login:
    post:
      security: []
      summary: 小程序登录（wx.login code 换 token）
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string, maxLength: 128, description: '0.6.27：无鉴权入口也要有长度上限（AJ-316）。真实 js_code 约 32 字符，128 是 4 倍余量；⚠️ 微信未公开保证该上限，超界只能靠 40001 兜底，不是合规校验'}}}}}}
      description: '0.6.27：状态码补 400（40001 code 缺失/超长——AJ-316 起入口才校验长度）、500（50000 wechat_login_not_configured：没配 AppID 是**我们的配置缺口**，不挂 404）、503（50300 code2session 出站熔断打开）'
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResp'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '429': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}, '503': {$ref: '#/components/responses/Err'}}
  /auth/admin/login:
    post:
      security: []
      summary: 管理端（admin-web）邮箱密码登录；仅 is_admin 且未封禁的账号，JWT 12 小时（aud=admin，ver=users.token_ver）；防爆破三层——IP 限流（5 次 / 15 分钟）、来源桶（同邮箱 × 同来源失败 5 次 / 15 分钟窗口）、邮箱桶（同邮箱不分来源合计 30 次 / 15 分钟窗口），任一层超限即锁 15 分钟（锁定期 429 / 42901 + Retry-After，0.6.20 订正，AJ-243）；初始管理员由启动时 seed（ADMIN_EMAIL + ADMIN_INITIAL_PASSWORD，只建不改）
      description: 0.6.11（AJ-181）实现落地。不存在的邮箱与口令错同为 40101（不作邮箱探测器）；口令对了才判是否管理员 / 是否封禁（40301）；0.6.64（AJ-442）：production / staging 下没开 TOTP 的管理员同为 40301；IP 维度另有 RATE_LIMIT_LOGIN_PER_15MIN 限流（D-52）
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, minLength: 12}, totp: {type: string, pattern: '^\d{6}$', description: '0.6.37（P1-5 / AJ-386）：TOTP 6 位码。账号开了第二因素（npm run admin:totp）时必填；码错 / 已用过（防重放）与口令错同为 40101；没开的账号带了也忽略。形状不对 → 40001'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {token: {type: string}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '429': {$ref: '#/components/responses/Err'}}
  /auth/admin/logout:
    post:
      summary: 管理员退出登录（0.6.64 / AJ-442，严格检查 A-8）
      description: '服务端作废：users.token_ver + 1，本人所有已签出的管理端 token 立即失效（token 里只有版本号、没有会话 id，所以是所有设备一起退）。无请求体。没带 token → 401 / 40101；非管理员 token → 403 / 40301。'
      responses: {'204': {description: 已退出}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /fx:
    get:
      security: []
      summary: 当日展示汇率（含缓冲），仅供文案展示
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {base: {type: string, example: JPY}, rates: {type: object, additionalProperties: {type: number}}, asOf: {type: string, format: date-time}}}}}}}
  /terms:
    get:
      security: []
      summary: 当前生效条款版本与法务页地址（D-45）；小程序法务页与建单前调用，建单时把 version 回传
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {version: {type: string, example: TOS-2026-09-20}, updated_at: {type: string, format: date-time, description: '0.6.10：当前实现不返回（可选）'}, urls: {type: object, description: '0.6.33：用户协议的**绝对地址**（<base>/legal/terms/#zh|ja|en，base = LEGAL_BASE_URL 或 CHECKOUT_BASE_URL）；两者都未配置时**整键省略**（不再给相对路径）', properties: {zh: {type: string}, ja: {type: string}, en: {type: string}}}, documents: {type: object, description: '0.6.33：四类法务文档（terms / privacy / refund / tokushoho）各三语言的绝对地址，省略规则同 urls', additionalProperties: {type: object, properties: {zh: {type: string}, ja: {type: string}, en: {type: string}}}}, seller: {type: object, description: '0.6.33：特商法表示的商家信息，只含已配置的字段（公司登记前为空对象，不编占位值）', properties: {name: {type: string}, representative: {type: string}, address: {type: string}, phone: {type: string}, email: {type: string}}}}}}}}}
  /support:
    get:
      security: []
      summary: 客服联系方式（0.6.33，剩余清单 4-2）
      description: 只回已配置的字段（SUPPORT_EMAIL / SUPPORT_WECHAT / SUPPORT_HOURS）；客服账号确定前为空对象，小程序据此不显示入口——不下发占位联系方式。
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {email: {type: string}, wechat: {type: string, description: 客服微信号}, hours: {type: string, description: 客服时间（展示文案）}}}}}}}
  /healthz:
    servers: [{url: 'https://api.example.com', description: '0.6.10：探针挂在根路径，不在 /api/v1 下'}]
    get:
      security: []
      summary: |
        健康检查（Render healthCheckPath）：**只报进程活着，不查任何依赖**。
        @why 存活探针查依赖（DB / 调度心跳）会把一次依赖抖动放大成全站重启——平台健康检查 503 → 杀进程。
        调度器看门狗**不由本端点承担**：I1 的 daily 对账 job 会读 job_runs 里 tick/daily 的 last_success_at 互相监视，
        超期走 error 日志告警（见 AJ-102 / 0.5.4 变更注记；/readyz 与 /healthz 的语义分工见 /readyz 条目）。
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {status: {type: string, example: ok}}}}}}}
  /readyz:
    servers: [{url: 'https://api.example.com', description: '0.6.10：探针挂在根路径，不在 /api/v1 下'}]
    get:
      security: []
      summary: |
        就绪探针（D21）：**查依赖**（当前为 DB `SELECT 1`），不通即 503——平台据此把实例摘出负载均衡。
        与 `/healthz` 的区别是**语义**不是细节：/healthz = 进程活着吗（不查依赖，避免一次 DB 抖动把整个服务重启一轮）；
        /readyz = 能接流量吗（查依赖）。⚠️ Render 的健康检查刻意配 `/healthz` 而**不是** `/readyz`：
        停机摘流（N7）期间 /readyz 会先转 503，若被平台当作健康依据会直接杀进程。
      responses:
        '200': {description: Ready, content: {application/json: {schema: {type: object, properties: {status: {type: string, example: ok}}}}}}
        '503': {description: '不就绪：依赖不可达，或正在停机摘流（N7 等待窗口内持续 503）', content: {application/json: {schema: {type: object, properties: {status: {type: string, example: degraded}}}}}}
  /internal/jobs/daily:
    post:
      security: [{internalSecret: []}]
      summary: 每日作业触发（Render Cron Job 调用）：立即 202，进程内异步执行对账 / 汇率刷新 / 存活校验，结果写 job_runs('daily')（D-45；经 Cloudflare 代理有 100 秒上限，不得同步执行）
      responses: {'202': {description: Accepted, content: {application/json: {schema: {type: object, properties: {run_id: {type: string}, started_at: {type: string, format: date-time}}}}}}, '401': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /home:
    get:
      security: []
      summary: |
        首页数据（D-51）：生效中的 Banner（`active` 且在 starts_at/ends_at 内，按 sort）+ 分类清单。
        @why 免鉴权：首屏首帧就要用，登录态不该挡住"看见这家店卖什么"。
        @why 两块合成一个端点而不是首页打两次：都是首屏首帧要用的，小程序一次请求一次往返；
        分成两个的代价是首屏要么等两次、要么先出一半（banner 后补会把列表往上顶一下）。
        @why 生效判定**只在服务端做一次**（`active` + 时间窗，两端闭区间，starts_at/ends_at 为 null = 该侧不限制）：
        前端拿本机时钟再判一次，时钟偏的用户会看到"该下架的还在 / 该上线的没来"，
        而这种表现是**随机的**——排查不会往时钟方向走（与 FxRate.is_current 同一条口径）。
        @why 0.6.74（AJ-491）：分类改为后台可配置（`/admin/categories`）。`categories` / `category_tabs` 只含**启用且至少有一件在售商品**的分类，按排序；
        `category_tabs` 带中文名（小程序按它渲染分类栏），`categories` 是同序的键数组（保留给旧版小程序）。
        按"在售"判、不按库存：售罄商品仍在售，分类不随库存跳动。`GET /products?category` 只校验键的形状，不存在 / 停用 → 空列表。
        @why 失败**不降级**成 `{banners: []}`：空数组与"取不到"在页面上长得一样，
        吞成空数组等于把一次 DB 故障伪装成"今天没配 banner"，运营会去查配置且永远查不到。
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {banners: {type: array, items: {$ref: '#/components/schemas/Banner'}}, categories: {type: array, items: {type: string}}, category_tabs: {type: array, description: '0.6.74（AJ-491）：可见分类（键 + 中文名），按排序', items: {type: object, required: [key, name], properties: {key: {type: string}, name: {type: string}}}}}}}}}}
  /beacon:
    post:
      security: []
      summary: 用户行为批量上报（0.6.50 / AJ-409，M-21；流 C → user_events）
      description: |
        小程序每 15 秒或攒满 20 条冲刷一次，失败直接丢弃、不重试（埋点有损，不能影响用户流程）。
        鉴权**可选**：带有效买家 Bearer token 时记 user_id；没有 / 无效 / 被封禁 / 版本失效 → 匿名记录，**不回 401**。
        `anon_id` 是客户端生成并本地保存的随机串（`an-` + 20 位 Crockford Base32），登录前后都带，用来把同一台设备的漏斗连起来。
        服务端时间（created_at）为准；`ts` 是客户端时间（epoch 毫秒，只校验形状 2020-01-01～2100-01-01，存进 props.client_ts）。
        40001 的 reason：beacon_shape（顶层不是对象或多键）/ anon_id_invalid / events_shape（非数组或空）/ events_too_many（> 20）/
        event_shape（事件多键）/ event_name_invalid / event_ts_invalid / event_props_invalid（缺键、多键或值不合形状）；后四个带 index。
        product_id / order_id 形状 `[A-Za-z0-9_-]{1,64}` 且须真实存在，不存在的那条丢弃（仍 204）。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BeaconBatch'}}}}
      responses: {'204': {description: 已落库（或全部因 id 不存在被丢弃）}, '400': {$ref: '#/components/responses/Err'}, '429': {$ref: '#/components/responses/Err'}}
  /products:
    get:
      security: []
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 20, maximum: 50}}
        - {name: category, in: query, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,31}$', description: '0.6.74（AJ-491）：分类键（后台可配置，不再是固定四值）；形状不对 → 40001；不存在 / 停用 → 空列表'}}
        - {name: keyword, in: query, schema: {type: string, maxLength: 64, description: '商品名（中文）或日文原名的子串，字面匹配、不区分大小写；不匹配 JAN 码（0.6.72 / AJ-487 起含日文原名）'}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ProductCard'}}, total: {type: integer}}}}}}}
  /products/{id}:
    get:
      security: []
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}, '404': {$ref: '#/components/responses/Err'}}
  /addresses:
    get: {summary: 我的地址, responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Address'}}}}}}}
    post:
      summary: 新增地址（美国格式，ASCII）
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressInput'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Address'}}}}, '400': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /addresses/{id}:
    put:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressInput'}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Address'}}}}}
    delete:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Deleted}}
  /orders/quote:
    post:
      summary: 报价（购物车 / 确认页；不落库、不扣库存）
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [items], properties: {items: {$ref: '#/components/schemas/OrderItemsInput'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Quote'}}}}, '409': {$ref: '#/components/responses/Err'}, '429': {$ref: '#/components/responses/Err'}}
  /orders:
    get:
      parameters: [{name: status, in: query, schema: {type: string, description: '0.6.49：一个或多个 OrderStatus，逗号分隔（任一命中），如 created,pending_payment；空段 / 非法值 / 重复参数 → 40001 status_invalid（0.5.5 起双词表统一）'}}, {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1, description: '0.6.69'}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20, description: '0.6.69'}}, {name: include_after_sale, in: query, schema: {type: string, enum: ['1'], description: '0.6.69：状态命中或有任何售后申请（「售后·退款」页签）'}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [items, total], properties: {items: {type: array, items: {$ref: '#/components/schemas/OrderListItem'}}, total: {type: integer, minimum: 0, description: '0.6.69：同条件总数（分页用）'}}}}}}, '400': {$ref: '#/components/responses/Err'}}
    post:
      summary: 建单（不含支付；扣减 stock；写 fx_snapshot 与 expires_at）
      description: 0.6.11（AJ-179）：REVIEW_MODE=on 时只收 REVIEW_SKU_ID，含其它商品整单 40401；审核期建的单 is_test=true
      parameters: [{$ref: '#/components/parameters/IdemKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [items, address_id, terms_version], properties: {items: {$ref: '#/components/schemas/OrderItemsInput'}, address_id: {type: string}, expected_total_jpy: {type: integer, description: '可选：前端确认页看到的合计；不等则 40905 价格已变动'}, contact_email: {type: string, format: email, maxLength: 255, description: '0.6.27：orders.contact_email 是 VARCHAR(255)，超长 40001。0.6.68：域名须有点、无空段、后缀 ≥ 2 且非纯数字（shared isContactEmailShape），否则 40001 contact_email_shape。可选：收货通知兜底邮箱（D-39）'}, terms_version: {type: string, description: '建单时刻生效的条款版本（如 TOS-2026-09-20）；服务端与 TERMS_VERSION（GET /terms 返回的 version）不一致则 40011，缺失或不匹配一律拒单（D-43）'}}}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/OrderCreated'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '429': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /orders/counts:
    get:
      summary: 「我的」四入口角标（0.6.69，S-7）
      description: 口径 shared ORDER_BADGE_STATUSES：unpaid = created + pending_payment；to_ship = paid；shipped = shipped；after_sale = refunding 或有进行中售后申请（同一张单只算一次）。只数本人的单。
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [unpaid, to_ship, shipped, after_sale], properties: {unpaid: {type: integer, minimum: 0}, to_ship: {type: integer, minimum: 0}, shipped: {type: integer, minimum: 0}, after_sale: {type: integer, minimum: 0}}}}}}, '401': {$ref: '#/components/responses/Err'}}
  /orders/{id}:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}}
  /orders/{id}/pay:
    post:
      summary: 发起支付（选通道）。同订单同通道未支付期内幂等返回同一意图；换通道先取消旧意图（D-33）。stripe 返回短链 pay_url（D-49），小程序不接收 client_secret
      description: 0.6.9（AJ-175/KD-3）：同一 Idempotency-Key 重放时不产生第二个支付意图、不再调机构，但 `pay_url` 的 token 为**重新签发**（明文 token 不落幂等表），旧链接随之失效；订单已不可付时重放体里的链接落地即 40102
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdemKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [channel], properties: {channel: {type: string, description: '通道 key（D-56/D-59：任意字符串，新增支付方式不需要改本契约、不需要新增路由；前端取值来自 GET /pay/channels 返回的 channel 字段，不写死；不在顶层 x-payment-channels 登记表内即 40001）'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentIntent'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '429': {$ref: '#/components/responses/Err'}, '500': {description: '50001 机构建会话失败（重试或切换支付方式）/ 50003 扣款所需汇率缺失 / 50000 其它', content: {application/json: {schema: {type: object, properties: {code: {type: integer}, message: {type: string}}}}}}, '503': {description: '0.6.27 补：50300 出站熔断打开（CircuitOpenError 原样抛，带 retry_after_ms）——含义是"上游在恢复，稍后再试"，与 50001 "机构真的失败了"是两种相反的前端动作', content: {application/json: {schema: {type: object, properties: {code: {type: integer}, message: {type: string}}}}}}}
  /pay/link/{id}:
    get:
      security: []
      summary: 短链落地（D-49）：校验 t=token 与订单状态后 302 到 Stripe Checkout Session URL；token 不符或订单已终态 → 302 到静态失效页（40102）。按 IP 限流；不放行 CORS；不记录 query
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: t, in: query, required: true, schema: {type: string}}]
      responses: {'302': {description: Location = Stripe Checkout Session URL 或失效页}, '429': {$ref: '#/components/responses/Err'}}
  /orders/{id}/cancel:
    post:
      summary: 取消（仅 created / pending_payment；同时取消未完成支付意图）
      description: '0.6.27：状态码此前只登记了 200 / 409，而代码实际还会回 40001（id 缺失）、40101（无 token）、40301（非 user 角色）、40400（订单不存在**或非本人**，两者同码防存在性探测）、50000、50300；MP3-04：调用前先问机构「这个会话付了没有」，问不到时 **fail-closed 拒取消**（50300 session_query_unavailable / session_query_failed），不是「查不到就当没付」'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {description: '40914：表已被别人改过（带 expected 时）；40918：在售商品装不下', content: {application/json: {schema: {type: object, properties: {code: {type: integer}, message: {type: string}}}}}}, '500': {$ref: '#/components/responses/Err'}, '503': {$ref: '#/components/responses/Err'}}
  /orders/{id}/confirm-receipt:
    post:
      summary: 买家确认收货（0.6.38 / AJ-387，P2-13）
      description: 'shipped → delivered；已 delivered / completed → 200 原样返回（幂等，不多写事件）；其余状态或有拒付限制 → 409 / 40902；非本人与不存在同为 40400（防存在性探测）。不发邮件。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [order_id, status], properties: {order_id: {type: string}, status: {type: string, enum: [delivered, completed]}}}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /orders/{id}/after-sales:
    post:
      summary: 买家申请售后（0.6.56 / AJ-420）
      description: '订单须为 shipped / delivered / completed，否则 409 / 40902 data.reason=status_not_allowed；已有进行中（open / processing）的申请 → 409 / 40902 data.reason=after_sale_open（同一订单同时只能一条，库部分唯一索引兜底）。reason 非枚举 → 40001 reason_invalid；description 去首尾空白后 1–500 字（按字符），空 → description_required，超长 → description_too_long。非本人与不存在同为 40400。不发通知。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason, description], properties: {reason: {type: string, enum: [not_received, damaged, wrong_item, quality, other]}, description: {type: string, minLength: 1, maxLength: 500}}}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {type: object, required: [after_sale], properties: {after_sale: {$ref: '#/components/schemas/AfterSaleRequest'}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /admin/client-errors:
    post:
      summary: 管理端前端报错上报（0.6.57 / AJ-421）
      description: '只写服务端 error 级运行日志 admin_client_error（消息 / 调用栈经统一脱敏，单字段 512 字符截断），进而进 Sentry 分流；不写 admin_audit，不落 user_events。kind 非枚举 → 40001 kind_invalid；message 去首尾空白后 1–500 字（空 → message_required，超长 → message_too_long）；stack ≤ 2000（stack_too_long）；page 须形如 ^[a-z][a-z0-9-]{0,31}$（page_invalid）。前端每次页面加载最多报 10 条并去重。'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kind, message], properties: {kind: {type: string, enum: [render, error, rejection]}, message: {type: string, minLength: 1, maxLength: 500}, stack: {type: string, maxLength: 2000}, page: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$'}}}}}}
      responses: {'204': {description: 已记录}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/orders:
    get:
      parameters:
        - {name: status, in: query, schema: {type: string, description: '0.6.44：一个或多个 OrderStatus，逗号分隔（任一命中），如 refunding,refunded；空段 / 非法值 → 40001 status_invalid'}}
        - {name: keyword, in: query, schema: {type: string, maxLength: 64, description: order_no / 收件人 / 运单号}}
        - {name: user_id, in: query, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$', description: '0.6.71（AJ-486）：只列这位买家的单（客户详情只列最近 50 张，其余从这里看全）。形状不符 → 400 / 40001；不存在的 id → 空列表'}}
        - {name: attention, in: query, schema: {type: string, enum: [ship_overdue, dispute_open, after_sale, late_paid, blocked, partial_refund], description: '0.6.71（AJ-485）dispute_open 支付上的拒付仍为 open（待举证）；won / lost / withdrawn 不算。0.6.70（AJ-484）ship_overdue 已付款且付款超过 SHIP_WITHIN_BUSINESS_DAYS 个工作日（JST 周一至周五，不扣节假日）仍未发货；0.6.89 起不含拒付锁定（has_dispute）的单。0.6.58（AJ-425）：待处理筛选——after_sale 有进行中售后（open / processing）；late_paid 迟到付款且未退款 / 退款中；blocked 下单人已拉黑且订单为 paid；0.6.67（AJ-454）partial_refund，0.6.70（AJ-483）收窄为有处理中（initiated / pending / unknown）的部分退款且订单不在 refunding / refunded。与其它条件"且"；非法 → 40001 attention_invalid'}}
        - {name: created_from, in: query, schema: {type: string, format: date, description: '0.6.44：下单日期下界，JST 日历日 YYYY-MM-DD（含当日）；非法 → 40001 created_from_invalid'}}
        - {name: created_to, in: query, schema: {type: string, format: date, description: '0.6.44：下单日期上界，JST 日历日 YYYY-MM-DD（含当日）；非法 → 40001 created_to_invalid；早于 created_from → 40001 created_range_invalid'}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 20, maximum: 100}}
        - {name: sort, in: query, schema: {type: string, enum: [created_at, '-created_at', total_jpy, '-total_jpy', paid_at, '-paid_at']}, description: '0.6.53：排序（-前缀 = 降序）；不传 = 下单时间倒序；白名单外 → 40001 sort_invalid。0.6.67（AJ-453）：paid_at 按付款时间，未付的单排最后——管理端「待发货」页签默认用 paid_at 正序'}
        - {name: include_test, in: query, schema: {type: string, enum: ['true', 'false'], default: 'false'}, description: '0.6.32：true = 连审核期测试单（is_test）一起列出（默认过滤；给了 keyword 时本来就不过滤）。其它取值 → 40001'}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AdminOrderListItem'}}, total: {type: integer}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrder'}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/ship:
    post:
      description: 仅 paid；has_dispute=true → 40909；0.6.11（AJ-179）：is_test（审核期测试单）→ 409 / 40902，测试单永不发货
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [carrier, tracking_no], properties: {carrier: {type: string, maxLength: 32, description: '0.6.27：orders.carrier 是 VARCHAR(32)，超长 40001 carrier_too_long（AJ-315）'}, tracking_no: {type: string, maxLength: 64, description: '0.6.27：orders.tracking_no 是 VARCHAR(64)，超长 40001 tracking_no_too_long（AJ-315）。服务端落库前归一：去掉所有空白（含全角空格）、字母转大写、保留连字符（AJ-410）；响应、订单详情、发货邮件里都是归一后的值。长度按归一后量'}}}}}}
      responses: {'200': {description: 'OK（0.6.27：响应体回 order_id / status / carrier / tracking_no 四个键，status 恒为 shipped；此前契约只写了 description: OK，与 admin-order-routes.ts 不一致）。0.6.37：另回 tracking_recognized', content: {application/json: {schema: {type: object, required: [order_id, status, carrier, tracking_no, tracking_recognized], properties: {order_id: {type: string}, status: {type: string, enum: [shipped]}, carrier: {type: string}, tracking_no: {type: string}, tracking_recognized: {type: boolean, description: '0.6.37（P1-10）：运单号形状认得出（日本邮便 S10 等）为 true；false 只是提示运营核对，已照常保存'}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /admin/orders/ship-batch:
    post:
      summary: 批量发货（0.6.45 / AJ-401；逐单复用单单发货逻辑，允许部分成功）
      description: '1–50 单；逐单一个事务、按顺序串行，闸门与 POST /admin/orders/{id}/ship 相同。结构错误（items 缺失 / 空 / 超 50 / order_id 非法 / 重复）整次 400 / 40001、一单都不发；逐单的失败（40001 / 40400 / 40902 / 40909 / 50000）按行回在 results 里，HTTP 仍 200。'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, minItems: 1, maxItems: 50, items: {type: object, required: [order_id, carrier, tracking_no], properties: {order_id: {type: string, minLength: 1, maxLength: 64}, carrier: {type: string, maxLength: 32}, tracking_no: {type: string, maxLength: 64, description: '服务端落库前归一：去掉所有空白（含全角空格）、字母转大写、保留连字符（AJ-410）；响应、订单详情、发货邮件里都是归一后的值。长度按归一后量'}}}}}}}}}
      responses: {'200': {description: OK（逐单结果，与 items 同序）, content: {application/json: {schema: {type: object, required: [results, succeeded, failed], properties: {succeeded: {type: integer}, failed: {type: integer}, results: {type: array, items: {$ref: '#/components/schemas/ShipBatchItemResult'}}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/cancel:
    post:
      summary: 取消未付订单（0.6.37 / AJ-386，P1-11）
      description: '仅 created / pending_payment；已付款 → 409 / 40902（走退款）。有已付款的机构会话（付款回调未到）→ 409 / 40902，等回调落定再处理。原因必填（进审计与订单时间线），上限 shared ADMIN_NOTE_MAX_LENGTH。回补库存、作废在途的机构会话，发 order.cancelled。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 500}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [order_id, status], properties: {order_id: {type: string}, status: {type: string, enum: [cancelled]}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/shipment:
    patch:
      summary: 改已发货订单的承运商 / 运单号（0.6.37 / AJ-386，P1-10）
      description: '仅 shipped；其余状态 → 409 / 40902。三项必填（承运商 ≤32、运单号 ≤64、原因 ≤500）。写 order_events(shipment_fixed，含改前 → 改后与原因) 与 admin_audit（含改前值），并按新运单号**重发**一封发货邮件（幂等键带本次修改 id，不会被当成重放吞掉）。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [carrier, tracking_no, reason], properties: {carrier: {type: string, maxLength: 32}, tracking_no: {type: string, maxLength: 64, description: '服务端落库前归一：去掉所有空白（含全角空格）、字母转大写、保留连字符（AJ-410）；响应、订单详情、发货邮件里都是归一后的值。长度按归一后量'}, reason: {type: string, maxLength: 500}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [order_id, carrier, tracking_no, tracking_recognized], properties: {order_id: {type: string}, carrier: {type: string}, tracking_no: {type: string}, tracking_recognized: {type: boolean}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/shipment/revert:
    post:
      summary: 撤销发货（0.6.63 / AJ-440，严格检查 P0 A-1）
      description: '仅 shipped 且发货后未满 72 小时（恰好 72 小时起拒）；其余状态或超时 → 409 / 40902（data.reason = status_<状态> / revert_window_passed）；有拒付限制 → 409 / 40909；有进行中（open / processing）售后 → 409 / 40902 after_sale_open。原因必填（去首尾空白后 1–500 字，shared ADMIN_NOTE_MAX_LENGTH），空 → 40001。订单回到 paid、清空 carrier / tracking_no / shipped_at（paid_at 不动）；写 order_events(shipment_reverted，含原承运商 / 运单号与原因) 与 admin_audit（含改前值）；给买家发一封更正邮件。不在状态机迁移表里（迁移表的 shipped → paid 会让重复到账回调把已发货单重新标已付），只有本端点能做。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 500}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [order_id, status], properties: {order_id: {type: string}, status: {type: string, enum: [paid]}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/notes:
    get:
      summary: 订单内部备注列表（0.6.42 / AJ-396）
      description: '按 created_at 先后（同刻按 id）。没有备注时 items 为空数组。订单不存在 → 404 / 40400。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/OrderNote'}}}}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}}
    post:
      summary: 追加一条订单内部备注（0.6.42 / AJ-396）
      description: '仅管理端可见，append-only（无改 / 删）。body 去首尾空白后 1–1000 字（shared ORDER_NOTE_MAX_LENGTH，UTF-16 码元）；空白 → 40001 order_note_required，超长 → 40001 order_note_too_long；订单不存在 → 40400。任何订单状态都可追加。进 admin_audit。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [body], properties: {body: {type: string, minLength: 1, maxLength: 1000}}}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {type: object, required: [note], properties: {note: {$ref: '#/components/schemas/OrderNote'}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/after-sales/{rid}/resolve:
    post:
      summary: 处理一条售后申请（0.6.56 / AJ-420）
      description: 'status 只能是 processing / resolved / rejected（其它 → 40001 status_invalid）；resolved / rejected 必须带 note（1–500 字，缺 → 40001 note_required，超长 → note_too_long），processing 可不带。流转：open → processing / resolved / rejected，processing → resolved / rejected；已结案 → 409 / 40902 data.reason=after_sale_closed，其它不允许的流转 → transition_invalid。申请不存在或不属于该订单 → 40400。不联动退款（退款仍走 refund / partial-refunds）。进 admin_audit。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: rid, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [processing, resolved, rejected]}, note: {type: string, maxLength: 500}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [after_sale], properties: {after_sale: {$ref: '#/components/schemas/AdminAfterSaleRequest'}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/refund:
    post:
      description: 订单 has_dispute=true 时拒绝（40907，D-50）；has_dispute=true 时**发货**也拒（40909，AJ-145）。⚠️ 0.6.10① 起 `has_dispute` 的语义是「**有未解除的拒付限制**」（进行中，或已败诉）：拒付结案时**仅胜诉与 withdrawn 复位**、闸门随之解锁，**败诉保持 true、闸门继续拦**（U-F4 / AJ-176；本句取代 0.6.7 的旧口径，那条已作废）。0.6.9（AJ-175/KD-4）：状态为 **refunding**（上次机构调用失败）时允许再调重试，沿用首次退款原因与同一机构幂等键；refunded 仍 40902。0.6.11（AJ-178 / F-03）：上一笔机构退款在途（refund_pending）时再调只查询该笔、不再发起；机构确认失败后换新机构幂等键重新发起；结果未知（超时 / 机构报错）仍沿用同键
      summary: 全额退款（MVP；按 charge_currency / charge_amount 原币退；缺货场景整单退款）
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 500, description: '0.6.12（B7 / AJ-191）：上限 500（机构 metadata 值上限）；超限 40001 + reason refund_reason_too_long。上限唯一真源 = shared REFUND_REASON_MAX_LENGTH，由契约测试双向比对。0.6.59（AJ-427）：「缺货」预设（= 缺货 / 以「缺货：」开头）落定时不回补库存'}}}}}}
      responses: {'202': {description: 'Accepted（succeeded = 已退款，订单 refunded；pending = 机构处理中，订单停在 refunding，再调即查询）', content: {application/json: {schema: {type: object, required: [order_id, outcome], properties: {order_id: {type: string}, outcome: {type: string, enum: [succeeded, pending]}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}, '503': {description: '0.6.27 补：50300 出站熔断打开（AJ-313）——这一次请求**一次都没有发出去**，不记 refund_failed 事件、不落 50000，带 retry_after_ms 让管理员稍后重试', content: {application/json: {schema: {type: object, properties: {code: {type: integer}, message: {type: string}}}}}}}
  /admin/orders/{id}/partial-refunds:
    post:
      summary: 部分退款（0.6.35 / AJ-383；含订单完成后的售后退款；0.6.52 起退满实收时订单转 refunded）
      description: '准入：订单 paid / shipped / delivered / completed，且无拒付限制（40907），且无在途的部分退款（40902 partial_refund_in_flight）；整单退款中或已退 → 40902。金额按**支付币种最小单位**（与 payments.charge_amount 同口径，例如 USD 的 10.00 = 1000），已退 + 在途 + 本次 ≤ 实收，超出 → 40001（reason exceeds_refundable，日志可见）。机构结果：succeeded / pending（再调 sync 查询）；机构确认失败 → 50000 且这笔释放额度；结果未知 → 50000 且这笔仍占额度（调 sync 用同一把幂等键取回结果）；熔断拒绝 → 503 / 50300，首次尝试前被拒释放额度、首次已发出则按未知占额度（0.6.52）。单笔不回补库存、不发买家邮件；**累计退满实收**时（0.6.52 / AJ-414）：记 refunded_by_parts，未发货的单回补库存，订单经 refunding 转 **refunded**（completed 除外），发整单退款邮件。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [amount_minor, reason], properties: {amount_minor: {type: integer, minimum: 1}, reason: {type: string, maxLength: 500, description: '与整单退款同一上限（shared REFUND_REASON_MAX_LENGTH）'}}}}}}
      responses: {'202': {description: Accepted, content: {application/json: {schema: {type: object, required: [refund], properties: {refund: {$ref: '#/components/schemas/PartialRefund'}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}, '503': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/partial-refunds/{refundId}/sync:
    post:
      summary: 同步一笔部分退款（0.6.35 / AJ-383）
      description: 'pending → 按机构单号查询；initiated / unknown → 用**同一把幂等键**重放（不换键，换键可能退两次）；已落定（succeeded / failed）→ 原样返回，不调机构。refundId 不属于该订单 → 40400。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: refundId, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [refund], properties: {refund: {$ref: '#/components/schemas/PartialRefund'}}}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}, '503': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/dispute/release:
    post:
      summary: 人工解除拒付限制（B1b / AJ-194，逃生口）
      description: 把 orders.has_dispute 由 true 置回 false，解锁发货（40909）与退款（40907）。⚠️ **不碰 payments.dispute_***：解除的是"限制"不是"事实"，拒付记录照旧留在风控列表。0.6.14（AJ-194）：已没锁的订单返回 **409 / 40902** dispute_not_locking（不是幂等 200——静默成功会让"点错单号"变成看不见的事故）；成功写 admin_audit（含改前值）与 order_events(status=dispute_released)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 500, description: '0.6.22（AJ-291）：解除理由必填（进审计台账与订单时间线）；上限 500 字，唯一真源 = shared ADMIN_NOTE_MAX_LENGTH（管理端补上 UI 后前端也需要它，故从服务端 domain 移入 shared）。⚠️ 与退款理由的 500 **同值不同源**：那条是机构 metadata 的硬上限，不可互相引用'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [order_id, has_dispute], properties: {order_id: {type: string}, has_dispute: {type: boolean}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/address:
    post:
      summary: 发货前改址（仅 paid 未发货；重写 address_snapshot 并记 order_events，D-39）
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressInput'}}}}
      responses: {'200': {description: OK}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /admin/products:
    get:
      summary: 商品列表（管理端；status 非法或 page/size 非法 → 40001）
      parameters: [{name: keyword, in: query, schema: {type: string}, description: '0.6.40：商品名 / 日文名 / JAN 码，字面匹配、不区分大小写'}, {name: low_stock, in: query, schema: {type: string, enum: ['true', 'false']}, description: '0.6.40：true = 只出库存 ≤ LOW_STOCK_THRESHOLD（5）'}, {name: status, in: query, schema: {type: string, enum: [active, offline, draft]}, description: '0.6.46：可筛 draft（草稿）'}, {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}, {name: size, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 100}}, {name: sort, in: query, schema: {type: string, enum: [updated_at, '-updated_at', stock, '-stock', price_jpy, '-price_jpy']}, description: '0.6.53：排序（-前缀 = 降序）；不传 = 更新时间倒序；白名单外 → 40001 sort_invalid'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AdminProduct'}}, total: {type: integer}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
    post:
      summary: 管理员建商品（**恒建草稿** status=draft，0.6.46；响应带 id：前端用它打后续的 PUT /{id} 与 PATCH /{id}/status）
      description: 0.6.46：新建即草稿，不再判 40918（上架时判）；请求体里的 status 忽略。0.6.6 补：上架校验命中任一条即 40001（见 ProductInput.compliance_tags 的七禁标签与 customs_desc_en 词表；weight_g / price_jpy 也在此校验）
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductInput'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/AdminProduct'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/products/{id}:
    put:
      summary: 更新商品字段（**不改上下架状态**；stock 省略即不改）；带**乐观锁**：expected_updated_at 对不上 → **40914**
      description: 0.6.9：上下架只走 PATCH `/status`，本接口不碰 status（原实现会把已下架商品悄悄改回 active）；stock 省略即保持当前库存（AJ-175）。0.6.6 补：🈲 不存在的 id **不得**返回 200——那会让运营以为改成功了、实际什么都没改（静默失败）。与 `/admin/banners/{id}` 的 PUT 同口径（40402）。0.6.18 补：请求体**必须**带 `expected_updated_at`（编辑页打开时那一行的 `updated_at`，由 `GET /admin/products` 下发），服务端按它做乐观锁；对不上时**整行不写**并回 409 / 40914（不是 40401：商品在，只是版本不是你看到的那一版）。缺该字段或不是合法时间 → 400 / 40001，**不退化成无锁覆盖**
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ProductInput'}, {type: object, required: [expected_updated_at], properties: {expected_updated_at: {type: string, format: date-time, description: '乐观锁凭据：编辑页打开时该行的 AdminProduct.updated_at（ISO 8601）。与库里当前值（按毫秒截断比较）不一致 → 409 / 40914'}, expected_stock: {type: integer, minimum: 0, description: '0.6.37（P2-8 / AJ-386）：带 stock 时**必填**——编辑页打开时看到的库存。下单扣减 / 关单回补不改 updated_at，只靠 expected_updated_at 护不住库存；库里已不是这个数 → 409 / 40914（整行不写），缺 → 400 / 40001 expected_stock_required。不带 stock 时忽略'}}}]}}}}
      responses: {'200': {description: 'OK（回整行 AdminProduct：与 Banner PUT 的空体不同，这里实现本就回整行，前端据此刷新表单）', content: {application/json: {schema: {$ref: '#/components/schemas/AdminProduct'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/products/{id}/status:
    patch:
      summary: 上架 / 下架；id 不存在 → **40401**
      description: 0.6.6 补：status 只收 active / offline，其它值 40001；0 行命中一律 40401（不静默 200）。0.6.46：草稿只能是起点——目标为 draft 一律 40001；draft → active 照判 40918
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {status: {type: string, enum: [active, offline]}}}}}}
      responses: {'200': {description: 'OK（回 {id, status}：让前端不必为了确认结果再拉一次列表）', content: {application/json: {schema: {type: object, properties: {id: {type: string}, status: {type: string, enum: [active, offline]}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/products/{id}/stock:
    patch:
      summary: 列表内联改库存（0.6.46 / AJ-403）；带库存乐观锁：expected_stock 对不上 → **40914**
      description: 只改 stock，不碰其它字段、**不刷新 updated_at**（库存不是商品信息，与下单扣减同口径）。草稿 / 下架商品也可改。
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [stock, expected_stock], properties: {stock: {type: integer, minimum: 0, maximum: 2147483647, description: '新库存；不合法 → 40001 stock_invalid'}, expected_stock: {type: integer, minimum: 0, maximum: 2147483647, description: '列表上看到的库存（乐观锁凭据）；缺 / 不合法 → 40001 expected_stock_required；与库里不一致 → 409 / 40914（未写入）'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {id: {type: string}, stock: {type: integer}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/upload:
    post:
      summary: 图片上传（multipart，服务端写对象存储并生成 thumb/card/detail 三档 webp；响应 ImageSet 增带 image_key = detail 档键）
      description: 0.6.8 补：单文件上限 **10MB**；只收 jpeg / png / webp，按 **magic bytes** 判定（不信客户端 Content-Type；svg 永不放行，heic 明拒）。类型不符 / 超限 → 40001。`image_key` 供 BannerInput 使用（AJ-143）
