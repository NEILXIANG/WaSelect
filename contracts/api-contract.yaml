openapi: 3.0.3
info:
  title: 日本直邮小程序 API
  version: 0.6.23
  description: |
    与《技术文档 v0.5》一致的机器可读契约（D-49～D-52：Stripe Checkout 托管页、拒付、banners、合规标签、限流）。金额一律整数最小单位（JPY 整数円、CNY/USD 整数分）。
    0.5.1（D-57）：管理端登录密码 minLength 10→12（对齐 N11/.env.example）；x-provider-events.stripe 补 checkout.session.async_payment_succeeded / async_payment_failed（实现早已识别，契约漏列）。
    0.5.2（D-58）：IdemKey required false→true（骨架实现缺头即 40001，契约宽松化是漂移）；/auth/admin/login 与 /pay/link/{id} 补 429 响应（契约已承诺限流，响应清单漏列）。
    0.5.3（D-59）：① `POST /orders/{id}/pay` 的请求体 `channel` 与 `PaymentIntent.channel` **去掉三值枚举**（改 `type: string`）——D-56「新增支付方式不再新增路由」的同一条逻辑：新增通道不该要求改契约 schema；当前登记在册的 key 改由顶层 `x-payment-channels` 机器可读字段声明，`scripts/check-contract.mjs` 仍拿它与 shared 的 `PAYMENT_CHANNEL` 做**双向集合比对**（防漂移这一层没丢，只是锚点从 schema 枚举换成了登记表）。
    ② `/orders/quote` 与 `/auth/wechat/login` 补 429 响应（D-52 已承诺限流，响应清单漏列）。③ `/readyz` 进契约（http.ts 早已实现并进 e2e，契约里没有这个路径）。
    0.5.4（AJ-102）：`/healthz` **删掉"调度看门狗"承诺**（原写"读 job_runs，tick/daily 超期则 503"，代码从未实现，且与 http.ts「存活探针不查依赖」的设计直接冲突——真实现会让 Render 把调度卡顿/DB 抖动当成实例故障杀进程）。改为对齐代码实际形状（只报进程存活）；调度器看门狗职责转交 I1 的 daily 对账 job（tick/daily 互相看心跳，异常走 error 日志告警），不由健康检查端点承担。
    0.5.5（I1-U5c）：`GET /orders` 的 `status` 参数**双词表统一**——废掉旧的五值 UI 词（unpaid/paid/shipped/delivered/closed），改用 `OrderStatus` 10 态同一词表（与 /admin/orders 同一 $ref）。映射：unpaid ≈ created+pending_payment（前端各查一次或不过滤）、closed ≈ cancelled+expired；paid/shipped/delivered 同名单态不变。
    0.5.6（I1-U6a）：① `PaymentIntent.payload` 的 mock 形状更正为 `{auto:true, orderId, amountJpy, currency}`（实现落地：auto 是审核期自动确认信号，前端不写死通道名）。② `POST /orders/{id}/pay` 补 429 响应（实现已挂 publicWrite 限流，响应清单漏列——同 0.5.3② 的同类漂移）。
    0.6.0（I1 收尾：U6b→U7b）：① `POST /internal/jobs/daily` 补 **500** 响应——未配置 `INTERNAL_JOB_SECRET` 时实现**响亮拒绝 50000**（不是 404：404 会把"我们没配密钥"表现成"cron 打错地址"，排查方向整个反掉）。响应清单漏列即漂移。② `Idempotency-Key` 补 `maxLength: 128`（实现已在 `scopeKey` 处拒绝超长键，超限 40001 + reason `idempotency_key_too_long`；契约无上限 = 契约比实现宽松，同一类漂移）。③ **0.5.4 的看门狗承诺兑现**：调度心跳不再由 `/healthz` 承担，改由每日对账 job 的第四类异常 `stalled_heartbeats` 报告（tick 10 分钟 / daily 26 小时无成功心跳即 error 日志；daily 首跑 last_success_at 为 null 不算停滞）。④ 骨架（`/api/v1/skeleton/*`）随 U6c 退役——它**从未进入本契约**，此处仅记一笔以说明"为什么找不到它"。
    鉴权：Bearer JWT（小程序 aud=mp；管理端 aud=admin）。D-49 起没有 H5 身份：银行卡支付在 Stripe Checkout 托管页完成。**声明了 IdemKey 参数的**写接口（建单、发起支付）支持 Idempotency-Key 头（24 小时内重复返回原响应；发起支付的重放补发新链接，见 0.6.9 ③）；其余写接口不认这个头（0.6.10 ⑥）。所有 bearerAuth 接口都可能返回 401 / 403（0.6.10 ⑤）。
    展示价只由后端计算（display 对象），前端不做汇率乘法。
    F11（ADR-28）：支付回调**合并为统一入口** `/pay/callback/{channel}`（channel 为路径参数，新增通道不再新增路由），
    并新增 `GET /pay/channels`——前端据此渲染支付入口，不写死通道名与按钮。
    0.6.1（I2 U-B1）：`GET /admin/orders` 的 `items` 从 `$ref: Order` 收紧为 **`AdminOrderListItem`**。
      @why 原声明是"列表每行都带 items / address / timeline / payment"——那是**详情**的形状，
      实现从来没这么做过（列表只给摘要 + 管理端专有列），属"契约比实现严格"的漂移，
      前端照它写会拿到一堆 undefined。收紧后列表形状显式：OrderSummary 五列 +
      `user_id` / `contact_email` / `carrier` / `tracking_no` / `has_dispute` / `is_test`。
      ⚠️ 比 `Order` **多**出来的正是 `has_dispute`：原 `Order` 没有它，前端因此只能"字段缺失即放行"
      退款闸门、拒付单要等打开详情才看得见（@see admin-web/src/orders/view.ts @limitation 二）。
      列表带上它，客服在列表页就能看见拒付单——代价是前端那份"缺失即放行"的注释要改成
      "缺失仍放行（防御），但正常路径下字段一定在"。
      ② 新增错误码 **40909**（有进行中的拒付，暂不可**发货**）。
      @why 不与 40907（暂不可**退款**）合并：两者是同一个事实的两个消费方，
      共用一个码会把"发货被拒"显示成"退款被拒"，客服照它去查退款，方向反掉。
    0.6.2（I2 U-B2d）：`/admin/orders*` 五条路由补 400 / 401 / 403 / 404 / 500 响应。
      @why 实现会返回它们（缺参数 40001、未登录 40101、非管理员 40301、订单不存在 40400、
      退款机构调用失败 50000），而原清单只写了 200 / 202 / 409——
      **响应清单漏列即漂移**（与 0.5.6 给 `/internal/jobs/daily` 补 500 同一条）。
      退款的 500 尤其要写：它表示"钱可能没退成、订单停在 refunding"，
      运维不能把它当成"接口坏了重试就行"。
      ⚠️ 待办：`/admin/products*` 四条同样是漏列状态（沿用旧写法），下一批统一补齐。
    0.6.3（I2 U-C3）：运营配置四条 `/admin/fx`、`/admin/shipping-rates` 落地并补齐 400/401/403/409/500。
      ① `GET /admin/fx` 的 summary 由「当前生效展示汇率」改为「**含历史与未来生效行**」并写明排序。
      @why 实现**不过滤**已生效：过滤掉未来行的后果是"刚提交的未来汇率在列表里消失"，
      运营会以为没保存成功；而"每币种只取最新一行（含未来）"会把未来行呈现成当前生效，
      属**误导**（比不显示更糟）。全量返回 + 排序是唯一不含糊的答案（AJ-150 ①）。
      ② `POST /admin/fx` 明确 **rate 由服务端算**（raw_rate × (1 + FX_BUFFER_RATE)），
      契约只收 `raw_rate`；`raw_rate` 补 `exclusiveMinimum: 0` 与 `maximum: 1000`（量纲护栏，AJ-148 ④）；
      同币种同生效时间重复 → **40910**（新增错误码）。
      ③ 两条写路由**无响应体**：契约未定义 body、前端也不读（ADR-28：无消费方的字段是死数据），
      保存后由前端重新 GET。      ④ 运费 PUT 明文写"事务内 delete + insert，中途失败整表回滚"
      与"启用的承运商必须恰好一家"（否则全站 50004，AJ-148 ③）。
    0.6.4（I2 U-D3）：Banner 四条 `/admin/banners*` 落地并补齐 401/403/404/500。
      ① `GET` 明文写"全量，含停用与未开始的"——只返回当前生效会让"停用"变成永久删除视图。
      ② `POST` 明文写"响应**必须带 id**"：前端拿它打后续 `PUT /{id}`，
      缺 id 的表现是"保存成功，一点编辑就打到 /undefined"（与订单主键 `order_id` 同类教训）。
      `PUT` 反过来只给 200 空体（契约未定义 body、前端不读）。
      ③ `PUT` 不存在 → **40402**（新增错误码）；🈲 明文禁止返回 200——那是静默失败。
      `DELETE` 则写"幂等：不存在的 id 也 204"。
      ④ `Banner.image` 由服务端用 `IMG_BASE_URL` 拼（**表里只存 `image_key`**，AJ-143）；
      该配置项**未配置时不带 `image` 字段**（空串会被前端当成"图裂了"，字段缺席才是"没有 URL"）。
    0.6.5（I2 U-E3）：风控两条 `/admin/disputes` 与 `/admin/users/{id}/block` 落地并补齐
      400/401/403/404/409/500。
      ① `status` 非法 → **40001**，🈲 明文禁止当成"不过滤"（假的业务结论，AJ-156 ①）；
      缺参数 / 空串 = 看全部（默认视图不是错误）。
      ② 拉黑 id 不存在 → **40403**；对方是管理员 → **40911**；🈲 明文禁止返回 200——
      那是静默失败。两条码**不折叠**：处置动作完全不同（刷新列表 vs 先撤管理员权限）。
      ③ 已拉黑的账号重复调用 → 200 **幂等**，明文写"不刷新 blocked_at"
      （刷新了就答不出"最初是什么时候封的"）。
      ④ `Dispute.opened_at` 明确为**开案时刻**（迁移 013 新增 `payments.dispute_opened_at`）：
      它取机构报文里的时间、可与入库时刻差数小时，而**举证期限的起点**是它；
      允许 NULL 是刻意的（写入方漏字段要暴露，不能被 now() 静默填平）。
    0.6.6（I2 U-G1）：商品管理四条 `/admin/products*` 补齐 400/401/403/404/500。
      @why 0.6.2 补 `/admin/orders*` 时已把这四条列为待办——**响应清单漏列即漂移**：
      实现会返回它们（上架校验 40001、未登录 40101、非管理员 40301、商品不存在 40401、
      DB 故障 50000），而原清单只写了 200 / 201，前端照它写会以为"除了成功没有别的分支"。
      ① `PUT /{id}` 与 `PATCH /{id}/status` 的 id 不存在 → **40401**，🈲 明文禁止 200
      （静默失败：运营以为改成功了，实际一行没动）。与 `/admin/banners/{id}` 的 40402 同口径。
      ② ⚠️ 两条写路由**有响应体**，与 0.6.4「无响应体」的 Banner 相反——
      实现本就回 `AdminProduct` / `{id, status}`，契约必须照实写：
      把"实际有 body"写成"无 body"比漏列状态码更糟（前端不敢读，于是为了确认结果多拉一次列表）。
      ③ `GET` 的 `status` 与 `page` / `size` 非法 → 40001（不是静默回落默认值：
      分页参数错了还返回第一页，运营会以为"总共就这些"）。
    0.6.7（I2 U-F4）：拒付**结案**落地，并兑现 `has_dispute` =「**有进行中的拒付**」这条口径。
      @why U-F3 只实现了开案，`dispute_status` 置 open 后**永远不变**；而 40907（退款）与
      40909（发货）闸门读的正是 `has_dispute`，于是"拒付已结案"的订单被**永久锁死**——
      不能发货也不能退款，且没有任何一方报错（运营只会觉得"系统不让我操作"）。
      ⚠️ 这不是显示问题，而且 `AdminOrder.has_dispute` 的描述**本来就写的是"存在进行中的拒付"**
      ——0.6.7 之前是**契约与实现不符**，这一版是修复漂移，不是改口径。
      ① `charge.dispute.closed` 归一化成 **`dispute_closed`**（与开案的 `disputed`
      **分成两个 outcome**）：合并的话每个拒付落账器都要自己分辨开案 / 结案，
      漏分辨的表现是"结案事件把开案又写一遍"——已 won 的拒付被重新标成 open。
      ② 结案结果（won / lost）取自 **Dispute 对象的 `status`**，事件类型本身不带它；
      由 domain 映射，**认不出就拒绝落库**（`dispute_result_unknown`），不猜默认值——
      "赢了却记成输了"与"输了却记成赢了"都是财务口径事故。
      ③ 结案时 `has_dispute` **复位为 false**（⚠️ **0.6.10① 起仅胜诉如此**：败诉保持 true，见下）；已结案且结果相同 → 幂等；
      结果不同 → 40902 `dispute_result_conflict`（不静默改判：财务口径留给人工裁决）。
      ④ 结案时刻取**入库时刻**（SQL now()），与开案时刻**相反**——
      开案时刻是举证期限的起点、必须取机构时间；结案时刻不是任何期限的起点，
      而 Stripe 的 dispute 对象上根本没有"结案时间"字段（能拿到的只有事件投递时刻）。
      ⑤ `ListDispute.has_dispute`（列表列）同义：有未解除的拒付限制（进行中，**或已败诉**），不含已解除的。
    0.6.8（I2 U-I1）：`ImageSet` 增 **`image_key`**（可选，AJ-143 定论的落地）。
      @why `BannerInput.image_key` 要的是**键**而 `POST /admin/upload` 原本只回三档 URL——
      让前端从 URL 反解键是靠字符串巧合工作（URL 规则一变就静默产出错键且无人报错）；
      让 BannerInput 改收 URL 会把存储位置（域名/CDN 前缀）写进业务表，换图床要改历史数据。
      增量字段向后兼容：老调用方继续只用三档 URL。
      ① `image_key` = **detail 档的存储键**（AJ-166）：Banner 展示用最大档；
      服务端**不存原图**（原图可能 10MB，直出当 banner 既慢又贵；代价是档位尺寸日后变更无法重生成，只能重传）。
      ② `image_key` 只在**上传响应**里出现；`Product.images` 等存量 ImageSet 条目没有它（故 optional）。
      ③ 上传限 **10MB**、只收 jpeg / png / webp（按 magic bytes 判，不信客户端 Content-Type；
      svg 是脚本载体永不放行，heic 因 sharp 不带 libheif 在入口明拒）。
    0.6.9（AJ-175，测试审查第二轮缺陷修复）：四处**行为变更**写进契约。
      ① `ProductInput.stock` 改为**省略即不改**：POST 省略按 0 建；PUT 省略则库存保持库里的当前值。
      @why 原来 PUT 是"整行覆盖"，管理端编辑页打开期间买家下单扣了库存，运营只改标题一保存，
      就把打开页面时读到的旧库存写回去——卖出的那件"凭空回来"，会超卖（测试审查 KD 库存覆盖）。
      前端只在库存**被改动**时才带 stock。仍会丢的情形：运营**确实改了库存**且期间有人下单——那是两个人改同一个数，需乐观锁，未做（见 @limitation）。
      ② `PUT /admin/products/{id}` **不再改上下架状态**（上下架只走 PATCH `/status`）。
      @why 原实现把请求体里没有的 status 写成默认 active：编辑一个已下架的商品会把它**悄悄重新上架**。
      ③ `POST /orders/{id}/pay` 的幂等**重放**：`pay_url` 里的 token 是**新签发**的（旧链接随之失效），不再逐字节等于首次响应。
      @why D-49 要求明文 token 不落库，但幂等表存了整个响应体 24 小时（KD-3）；现改为落库前抹掉 token、重放时补发。
      订单已不可付（非 pending_payment 或已过期）时，重放体里的链接落地即 40102（与"链接已失效"同口径）。
      ④ `POST /admin/orders/{id}/refund`：订单停在 **refunding**（上次机构调用失败，500）时**可以再调一次重试**，
      沿用**首次**的退款原因、向机构发同一幂等键（机构侧不会退两次）；已 refunded 仍 40902（KD-4）。
      ⑤ `AdminOrderListItem` 增 **`recipient`**（收件人姓名，可选：快照缺失时省略）。
      @why 列表早就支持"按收件人搜"、管理端列表也有"收件人"列，但行里不带它——搜中的行收件人一栏恒为空
      （前后端接缝测试实测，KD-14）。只加姓名一列，其余地址字段仍只在详情（最小暴露）。
    0.6.10（AJ-176，代码↔文档一致性审计）：契约与实现对齐，两处**行为变更**，其余为漏列/措辞更正（①～⑦）。
      ① 行为变更：拒付**败诉**（dispute.closed + lost）后 `has_dispute` **保持 true**，发货 40909 / 退款 40907 继续拦；
      只有**胜诉**复位（0.6.7 原为：胜诉与败诉都复位）。
      @why 败诉 = 钱已被机构拉回持卡人：再发货钱货两空；再退款 Stripe 必拒（`charge_disputed` /
      `refund_disputed_payment`，docs.stripe.com/error-codes 2026-09-28 核对），订单会卡在 refunding。
      `has_dispute` 的语义随之扩为"**有未解除的拒付限制**（进行中，或已败诉）"。
      ② 行为变更：`Order.timeline`（买家订单详情）**只含订单状态值**（OrderStatus 10 态）；改址 / 拒付 / 退款失败等管理事件
      只在 `AdminOrder.events` 里。@why 曾不过滤：买家详情出现"状态未知"行，且拒付开案/结案被买家看见。
      ③ `x-error-codes` 登记表补齐 40402 / 40403 / 40910 / 40911（实现早已使用，只写在版本说明正文里）；
      `scripts/check-contract.mjs` 改为只认登记表段的**双向**比对（旧的全文子串匹配放过了这四个）。
      40400 的含义更正为"资源不存在（含他人资源，同码防存在性探测）"——实现一直把它用于订单 / 地址不存在。
      ④ `/healthz` `/readyz` 挂在**根路径**（不在 `/api/v1` 下）：两条补 path 级 `servers`。
      ⑤ 漏列补齐：`POST /orders` 补 400/401/403/404/429/500；`POST /orders/{id}/pay` 补 400/401/403/404/500（含 **50001**：
      机构建会话失败，实现本轮起才真正抛出，原被兜底成 50000）；回调 200 的 `ignored` 取值补 `late_payment` / `settlement_mismatch`。
      所有 bearerAuth 接口都可能返回 401（40101）与 403（40301：封禁 / 角色不符 / 撤权），不再逐条重复列出。
      ⑥ 措辞更正：Idempotency-Key 只对**声明了 IdemKey 参数**的写接口生效（建单 / 发起支付），其余写接口带了也被忽略；
      封禁后是**所有买家鉴权接口** 40301（不只建单）；`AdminOrder.payment` 按 `Order.payment` 形状（`channel` 而不是 `provider`）；
      `AdminOrder` 不带 `display` / `timeline`（看 `events` 全量），另带 `paid_at` / `shipped_at`；
      `/auth/admin/login` 与 `/home` 标注**未实现**（契约先行，routes.contract.test 登记在 NOT_IMPLEMENTED）；
      `/terms` 的 `updated_at` 当前不返回、`urls` 为占位相对路径；`Order.duty_jpy` 无法估算时为 **0**（与 `Quote.duty_jpy` 的 null 不同，AJ-176 未决项）。
      ⑦ 管理端商品 / Banner 漏列的校验补进 schema（实现早已如此拦截）：`GET /admin/products` 的 `size` ∈ [1, 100]；
      `ProductInput.category` 限四个分类（与 `PRODUCT_CATEGORY` 同源）；`BannerInput.link_id` 在 `link_type` ≠ none 时必填、`sort` ≥ 0；
      商品详情不返回 `image`（用 `images`），管理端商品另不返回 `display` / `image`。
    0.6.11（AJ-178～AJ-183，独立审查辨析处置）：
      ① `POST /admin/orders/{id}/refund`：202 响应体入契约 `{order_id, outcome: succeeded|pending}`；
      订单停在 refunding 且上一笔机构退款在途（`refund_pending` 事件）时，再调**只查询**该笔退款、不再发起；
      机构确认失败后换新机构幂等键重新发起（F-03）。`AdminOrder.events` 新增 `refund_pending`（note = 机构退款号），
      `refund_failed` 的 note 取值 `provider_error` / `provider_failed:<机构退款号>`。
      ② 审核模式（技术文档 §2.9 落地）：`REVIEW_MODE=on` 时 `POST /orders` 只收 `REVIEW_SKU_ID`，含其它商品整单 **40401**；
      审核期建的单 `is_test=true`；mock 通道 `payload.auto` 改为**布尔**——只有服务端会自动确认（审核模式）时才是 true，
      且响应返回时订单已被确认为 paid（经与真实回调同一条管线）；非审核模式为 false。
      `POST /admin/orders/{id}/ship` 对 `is_test` 订单 **409 / 40902**（测试单永不发货）。
      ③ `Product` 增 `ship_within_business_days`（发货时限承诺，工作日；配置 SHIP_WITHIN_BUSINESS_DAYS，D-39⑦ FTC）。
      ④ `POST /auth/admin/login` **已实现**（移出 NOT_IMPLEMENTED）：补 400；失败计数超限后锁 15 分钟，
      锁定期间一律 **429 / 42901**（带 Retry-After，与 IP 限流同码）；不存在的邮箱与口令错同为 40101；非管理员 / 已封禁 40301。
      ⚠️ **0.6.20 订正**：此处原写"同一账号连续失败 5 次锁 15 分钟"——那是 AJ-243 **之前**的口径（单桶、按邮箱）。
      现在是**两层桶**：同邮箱 × 同来源 5 次，或同邮箱不分来源合计 30 次（窗口都是 15 分钟，OPS3-04）。
      ⑤ 管理端写接口（/admin 前缀下 POST/PUT/PATCH/DELETE 成功时）写 `admin_audit`（流 B）；对外形状不变。
    0.6.12（B7 / AJ-191）：`POST /admin/orders/{id}/refund` 的请求体 `reason` 补 **maxLength: 500**——
      理由会原样写进机构的 metadata，超长时机构拒掉这一整笔退款；而重试必须沿用首次理由（KD-4 / AJ-175，同键同参）、
      `order_events` 又是 append-only，理由改不了删不掉 ⇒ 超长的理由会把订单**永久**钉在 refunding。
      服务端在入口即拒（`40001` + reason `refund_reason_too_long`），订单不进 refunding；
      适配器对存量超长理由做**确定性**截断兜底（重试之间必须截出同一段，否则同键异参）。
    0.6.13（B1 / AJ-193）：拒付结案结果**从两种变三种**——`Dispute.dispute_status` 枚举增 `withdrawn`
      （机构撤回 / 未进入正式拒付：`warning_closed`、`prevented`）。
      @why 查询函（inquiry）以 `warning_needs_response` 开案照样置 `has_dispute=true`，
      而以 `warning_closed` 结案时旧实现抛 `dispute_result_unknown` ⇒ `has_dispute` 永远是 true
      ⇒ 发货 40909 / 退款 40907 永久生效，而全仓只有 `markDisputeClosed` 会写回 false。
      `has_dispute` 的复位规则因此改为：**只有 lost 保持 true**，won 与 withdrawn 都复位。
    0.6.14（B1b / AJ-194）：新增 `POST /admin/orders/{id}/dispute/release`——**人工解除拒付限制**的逃生口。
      @why `has_dispute` 为 true 时发货 40909 / 退款 40907 全被锁住，而能保证它变回 false 的路径只有一条：
      机构发来 `charge.dispute.closed`。那条链会断在任何一环（漏发 / 没接住 / 未知状态被拒落库），
      断了之后唯一解法就是直连数据库改行——既不留痕也不可复核。
      ⚠️ 它**不碰** `payments.dispute_*`：解除的是限制，不是事实。
      已没锁的订单 → 409 / 40902 `dispute_not_locking`（不是幂等 200）。
    0.6.15（B28 / AJ-213）：`POST /admin/users/{id}/block` **连带取消该用户的在途单**——
      行为变更（响应形状不变，副作用变多）：拉黑时在同一事务里把该用户
      `created` / `pending_payment` 的单迁 `cancelled`，回补库存、作废在途支付行（initiated → cancelled），
      并分发 `order.cancelled`（订阅者顺带作废机构侧会话）。
      @why 拉黑原本只写 `blocked_at` + `token_ver+1`，作用于**带 Bearer 的接口**；
      无鉴权的 `/pay/link` 短链不查用户状态 ⇒ 拒付滥用者被拉黑后手上的单在支付窗口内照样能付，
      付款后进 paid，运营会把货发给一个已知的拒付滥用者。
      @why 选"取消订单"而不是"给短链加一次状态查询"：后者只堵四个入口里的一个，
      而"这张单该不该继续存在"必须在**数据上**成立，一次取消让所有下游读到同一个事实。
      ⚠️ **已付单不受影响**（`paid → cancelled` 不在状态迁移表里）：已付的钱只能走退款链路，
      "已付未发货"是运营判断（退款还是照发），不由本接口代劳。
      ⚠️ 被取消的单之后到账的钱按**迟到付款**处理（40902 `late_payment` → 转对账/人工退款），
      不为"被拉黑的人付了款"新造判定路径。
      ⚠️ 订单时间线的 `actor` 是 `admin:block`，不是 `user:<id>`：审计要答得出"是谁关的"。
    0.6.16（工程库 AJ-239）：新增错误码 **40912**（包裹超过可配送的重量上限，请拆单）——
      `POST /orders/quote` 与 `POST /orders` 在"有运费表、但包裹重量（商品 + 包材）超过该承运商最大一档"时返回
      409 / 40912；此前与"运费表没配"共用 500 / 50004。
      @why 50004 的 action 是"管理员补齐参数"，对配置缺失是对的；超重是买家减少数量或分单就能解决的事，
      归 5xx 会让买家看到"系统错误"且没有拆单指引，并让每次改数量都产生一条 error 日志、淹掉真正的配置事故。
      ⚠️ "该承运商一档启用的运费都没有"仍是 50004（那才是配置事故）。
      @why 不复用 40906（订单金额超过上限）：一个看金额、一个看重量，合成一个码后前端说不出是哪个超了。
      同版（工程库 AJ-240）：新增错误码 **40913**（未付款的订单太多）——`POST /orders` 在该用户
      `created` / `pending_payment` 的订单数已达上限（配置 `MAX_OPEN_ORDERS_PER_USER`，默认 3）时返回 409 / 40913，不扣库存。
      @why 库存在建单时即扣、支付窗口（30 分钟）过后才回补，而限流只按 IP：没有每用户上限，
      一个账号就能循环建单把全店库存占满，且每张单都是"合法的待付款单"，对账不会报。
      同一接口另增一种 403 / 40301：建单事务内复核到该用户已被拉黑（鉴权层身份缓存最长 60 秒的窗口）。
    0.6.17（工程库第三轮审查 DOM3-02 / 第二轮 DB2-03）：`GET /admin/disputes` 的查询参数 `status` 枚举补 `withdrawn`——
      0.6.13 起 `Dispute.dispute_status` 已是四值（含 withdrawn），实现（`parseDisputeStatus`）也一直接受它，
      只有这个查询参数的声明停在三值；单测原来只比对响应 schema，于是这处漂移一直是绿的。
    0.6.18（工程库第三轮审查 ADM3-02 + DB3-02）：`PUT /admin/products/{id}` **带乐观锁**。
      ① 请求体在 `ProductInput` 之外**并列**增 `expected_updated_at`（**必填**，ISO 8601）：
         服务端以 `where … and date_trunc('millisecond', updated_at) = $x` 更新，0 行命中时
         ——id 不存在 → 404 / 40401；`updated_at` 对不上 → **409 / 40914**（整行**未写**）。
         缺失或不是合法时间 → **400 / 40001**（不退化成"无锁覆盖"）。
      @why 整行 PUT + 编辑页数据取自列表快照：运营只补一张图保存，就会把期间别人改过的
      售价 / 重量 / 报关品名整条回滚，且不报任何错（ADM3-02）。"无锁但能用"比"带锁但会响亮失败"危险。
      @why 用 `updated_at` 而不是新增版本号列：`products.updated_at` 已存在、已在响应里下发、
      语义也正是"这一版是哪一版"，新增一列要动迁移 + 三处写入点；代价见 ②。
      ⚠️ `date_trunc('millisecond', …)` **不能省**：Postgres `timestamptz` 默认精度 6 位（微秒），
      而客户端拿到的是毫秒精度的 ISO 串——直接等值比较会让**每一笔** PUT 都被判成冲突。
      ② 行为变更：`products.updated_at` 的语义收窄为「**商品信息**最后被改的时刻」——
         `decrementStock` / `incrementStock`（下单扣减、取消与关单回补）**不再**刷新它。
      @why 它同时是管理端列表的排序键：买家下一单就把商品顶到第 1 位，运营翻页时整体位移 → 漏行 + 重行（DB3-02）；
      而在 ① 之后，每次成交还会把运营正在进行的编辑判定为"被别人改过"（AJ-175 的
      "编辑期间下单仍能保存、不覆盖库存"就此失效）。库存是**实时余额**，不是商品信息。
      ⚠️ `PATCH /admin/products/{id}/status`（上下架）**仍然**刷新它：上下架是商品信息的一部分。
      ③ 新增错误码 **40914**（这个商品在你打开之后被别人改过了）。
    0.6.19（工程库第三轮审查 ADM3-05）：`GET /admin/fx` 的 `FxRate` **增带 `is_current`**（boolean，服务端按自己的时钟判定）。
      @why 前端原先拿**浏览器时钟**与 `effective_from` 比来推"哪一行当前生效"，而"立即生效"的时刻是服务端打的：
      管理员电脑慢几分钟，刚保存的那行被判成"尚未生效"，保存前的量级核对基准回退到上一条
      （先录错、马上改正时，第二次核对拿的是**错误值之前**那条）；快几小时则把预约行当成当前值。
      "现在几点"只有一个权威，就是服务端。下发**布尔**而不是下发 `now`，
      是为了让前端不存在第二份"哪一行是当前"的判定（第二份必然漂移）。
      ⚠️ 该字段**缺省不算 true**：前端遇到缺失必须按"没有基准"处理（要求人工勾选确认），
      🈲 不得退回用本机时钟猜——猜出来的"不可疑"会一键写库。
      同币种**至多一行**为 true；判定与 `findLatestFxRate`（POST 侧算"上一条"）同源。
    0.6.20（工程库第三轮审查 PAY3-06）：`POST /auth/admin/login` 的**锁定口径订正为两层桶**。
      @why 契约自 0.6.11④ 起一直写着"同一账号连续失败 5 次锁 15 分钟"这句已被订正的说法，
      而 AJ-243 早已把它拆成两层：
      来源桶（同邮箱 × 同来源，5 次）挡"一个来源反复试"，邮箱桶（同邮箱不分来源，合计 30 次）挡
      "换 IP 慢慢试同一个账号"。照旧文案实现的前/后端会把邮箱桶那一层整个漏掉。
      两层的**窗口都是 15 分钟**（OPS3-04）：`failed_count` 曾是不带窗口的累计值，
      "30 次 / 15 分钟"其实是"累计 30 次不分多久"，慢速攻击（每 15 分钟 5 次）约 90 分钟攒满。
      对外形状不变（仍是一个 42901 + Retry-After），消费方只需知道"被锁"这件事。
    0.6.21（工程库第三轮审查 ADM3-01 纵深防御）：`POST /admin/users/{id}/block` **接受可选请求体** `{order_id?}`。
      ① 带了 `order_id`：服务端在**同一事务内、封号之前**核对"这张单属于 `{id}` 这个用户"；
         不属于（含"这张单不存在"）→ **409 / 40915**，整条请求**一点不写**。
         不带：不加约束（拉黑的对象是**用户**，不是订单）。
      @why **可选**而不是必填：把它设成必填会把"拉黑用户"与"处理拒付"两个语义焊死，
      将来若有别处要拉黑就得"随便传一个 order_id"绕过——那比不做校验更糟（**假校验**）。
      而风控页是唯一调用方且**总是**带 order_id（确认面板只在拿到 orderId 时才出现），
      所以实际防护强度等于必填，却没有焊死语义的代价。
      @why **传了必校验**：拉黑是本契约唯一**不可逆**的写操作（没有解除接口，AJ-135），
      且会连带取消该用户在途单、回补库存、作废机构会话。多一道凭据核对的成本是几行 SQL。
      ⚠️ 它**挡不住**"运营看错了面板"（那种情况下请求里的 order_id 与 user_id 是自洽的，
      AJ-256 已用前端清空待确认态解决）；它挡的是"order_id 与 user_id 配错"这一类请求级错误，
      是纵深防御的**第二层**，不是第一层的替代品。
      ② 新增错误码 **40915**（这张订单不属于你要拉黑的这个用户）。
    0.6.22（工程库 AJ-291）：**管理端补齐「人工解除拒付限制」的 UI**——订单详情页在
      `has_dispute === true` 时出现该按钮（理由必填 + 两步确认），落点 `admin-web/src/orders/OrderDetail.tsx`。
      @why 本接口自 0.6.14（AJ-194）起就实现并有留痕，但"只有接口没有 UI"意味着
      运营遇到拒付链断（机构漏发 `charge.dispute.closed`、未知状态被拒落库、
      败诉单后来与买家协商好了）时只能直连数据库改行——那既不留痕也不可复核。
      ⚠️ 只在**详情页**给入口，**不**放进订单列表逐行：本动作不可逆且契约没有"重新上锁"，
      逐行按钮会把"点错单号"变成一次真实且收不回的解除（40902 是兜底，不该是主防）。
      ② `reason` 的上限 **500** 的唯一真源改为 **shared `ADMIN_NOTE_MAX_LENGTH`**
      （原先只在服务端 `domain/admin-order-actions.ts`，理由是"没有前端消费方"；
      现在前端输入框要用它，再写一份就是第三份 500）。
      ⚠️ 它与退款理由的 500 **同值不同源**：那条是机构 metadata 的硬上限，两条不得互相引用。
    0.6.23（S4 前置 / AJ-296①）：`ProductCard` / `Product` / `ProductInput` 增三个**编辑口径**字段
      ——`why`（为什么值得买）/ `maker`（产地·工房·匠人）/ `tags`（展示标签）。
      ① **都必须可选**：`why` 是编辑撰写的内容，不是"商品能不能卖"的事实。
        必填会逼运营"随便填一句"交差，首页立刻出现一批"高品质""匠心工艺"式的假文案——
        这比留白更伤：`why` 退化成口号时整个品牌的差异化消失（用户旅程地图 A 旅程的判定点）。
      ② **`why` 缺失时前端必须降级**，不报错、不用通用话术顶上（`pick-card` 降级为不含 why 的形态）。
        服务端对 `why` / `maker` 为 null 的情形**整键省略**（不返回 null），
        让"没写"与"写了空串"在 JSON 里可区分——后者是脏数据，该被看见而不是被洗白。
        `tags` 恒为数组（DB 列 NOT NULL DEFAULT '[]'，只有"空数组"一种空态）。
      ③ **不复用 `description`**：`description` 是客观描述（这东西是什么），`why` 是编辑口径
        （为什么值得买）。混在一个字段里，将来想分别运营、分别国际化就分不开了
        （本项目条款已有 zh/ja/en 三语，国际化不是假设）。
      ④ **不与 `compliance_tags` 混用**：后者管"能不能寄"（封闭枚举，部分取值上架即拒），
        `tags` 管"值不值得买"（自由文案，给买家看）。往 compliance_tags 里填营销词会让合规判断失效。
      ⑤ 长度：`why` 200 / `maker` 120（shared `PRODUCT_MAX_CHARS`，与 DB 列宽与应用层上限同源）；
        超限报 40001（`why_too_long` / `maker_too_long`）而**不静默截断**——
        截断会把一句判断截成半句，而半句话读起来正好像口号（最坏的降级结果）。
servers:
  - url: https://api.example.com/api/v1
security:
  - bearerAuth: []
x-error-codes:
  description: 业务错误码注册表（唯一真源 = 技术文档 v0.5 §7）；码前三位即 HTTP 状态。packages/shared/src/errors.ts 必须与本表一致，由 scripts/check-contract.mjs 防漂移。
  codes:
    40001: 参数缺失或格式错误
    40002: 地址须为英文/拼音或电话格式错误
    40011: 条款版本缺失或已过期
    40101: 未登录或登录已过期
    40102: 支付链接无效或已失效
    40103: 回调验签失败（D6：入站方问题，4xx，不占 5xx 通道）
    40301: 无权限
    40400: 请求的资源不存在（含他人资源：订单 / 地址按归属判定，与不存在同码防探测；未知路径也归此码）
    40402: 该 Banner 不存在或已被删除
    40403: 该用户不存在
    40401: 商品不存在或已下架
    40901: 库存不足
    40902: 订单状态不允许此操作
    40903: 重复提交
    40904: 订单已过期
    40905: 价格已变动
    40906: 订单金额超过上限，请拆单
    40907: 该支付存在进行中的拒付，暂不可退款
    40908: 幂等键复用但请求内容不一致（D4：客户端须为每次新意图生成新键）
    40909: 该支付存在进行中的拒付，暂不可发货（与 40907 同一事实的两个消费方：退款用 40907、发货用 40909）
    40910: 该币种在此生效时间已有一条汇率
    40911: 不能拉黑管理员账号
    40912: 包裹超过可配送的重量上限，请拆单（0.6.16：有运费表但超过最大一档；运费表缺失仍是 50004）
    40913: 未付款的订单太多了，请先完成支付或取消后再下单（0.6.16：每用户在途单上限）
    40914: 这个商品在你打开之后被别人改过了（0.6.18：PUT /admin/products/{id} 的乐观锁冲突；整行未写，前端须保留表单并提示刷新后对照最新值再保存）
    40915: 这张订单不属于你要拉黑的这个用户（0.6.21：POST /admin/users/{id}/block 带了 order_id 但归属核对不过；整条请求未写）
    42901: 请求过于频繁
    50000: 服务器内部错误
    50001: 支付创建失败
    50003: 汇率不可用
    50004: 运费不可计算
    50300: 服务暂时不可用（上游熔断打开，按 data.retry_after_ms 退避）
x-payment-channels:
  description: |
    **当前登记在册**的支付通道 key（D-56 / D-59）。
    ① 这是**登记表，不是枚举约束**：本契约所有 schema 里的 channel 字段一律 `type: string`——
       新增支付方式只需在注册表与配置里加一条，**不需要改本契约、也不需要新增路由**
       （`/pay/callback/{channel}` 的 channel 是路径参数，`GET /pay/channels` 返回可选项）。
       把它写成 OpenAPI `enum` 等于宣布"每加一个通道都要发一版契约"，与 D-56 直接冲突。
    ② 它是**机器可读**的：`scripts/check-contract.mjs` 取这里的 `keys`，与
       `packages/shared/src/enums.ts` 的 `PAYMENT_CHANNEL` 做**双向集合比对**——
       只在 shared 加了通道而契约没登记（或反之）都会在 gate 里报红。
       @limitation 它守的是"两端登记一致"，**守不住"登记了但适配器没装配"**（那是装配层的事）。
    ③ 不在表内的 key：建单路径 40001（`POST /orders/{id}/pay`）、回调路径 40001（`/pay/callback/{channel}`）。
  keys: [mock, wechat, stripe]
paths:
  /auth/wechat/login:
    post:
      security: []
      summary: 小程序登录（wx.login code 换 token）
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResp'}}}}, '401': {$ref: '#/components/responses/Err'}, '429': {$ref: '#/components/responses/Err'}}
  /auth/admin/login:
    post:
      security: []
      summary: 管理端（admin-web）邮箱密码登录；仅 is_admin 且未封禁的账号，JWT 12 小时（aud=admin，ver=users.token_ver）；防爆破三层——IP 限流（5 次 / 15 分钟）、来源桶（同邮箱 × 同来源失败 5 次 / 15 分钟窗口）、邮箱桶（同邮箱不分来源合计 30 次 / 15 分钟窗口），任一层超限即锁 15 分钟（锁定期 429 / 42901 + Retry-After，0.6.20 订正，AJ-243）；初始管理员由启动时 seed（ADMIN_EMAIL + ADMIN_INITIAL_PASSWORD，只建不改）
      description: 0.6.11（AJ-181）实现落地。不存在的邮箱与口令错同为 40101（不作邮箱探测器）；口令对了才判是否管理员 / 是否封禁（40301）；IP 维度另有 RATE_LIMIT_LOGIN_PER_15MIN 限流（D-52）
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, minLength: 12}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {token: {type: string}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '429': {$ref: '#/components/responses/Err'}}
  /fx:
    get:
      security: []
      summary: 当日展示汇率（含缓冲），仅供文案展示
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {base: {type: string, example: JPY}, rates: {type: object, additionalProperties: {type: number}}, asOf: {type: string, format: date-time}}}}}}}
  /terms:
    get:
      security: []
      summary: 当前生效条款版本与法务页地址（D-45）；小程序法务页与建单前调用，建单时把 version 回传
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {version: {type: string, example: TOS-2026-09-20}, updated_at: {type: string, format: date-time, description: '0.6.10：当前实现不返回（可选）'}, urls: {type: object, description: '0.6.10：当前为占位相对路径，法务页上线后改绝对 URL', properties: {zh: {type: string}, ja: {type: string}, en: {type: string}}}}}}}}}
  /healthz:
    servers: [{url: 'https://api.example.com', description: '0.6.10：探针挂在根路径，不在 /api/v1 下'}]
    get:
      security: []
      summary: |
        健康检查（Render healthCheckPath）：**只报进程活着，不查任何依赖**。
        @why 存活探针查依赖（DB / 调度心跳）会把一次依赖抖动放大成全站重启——平台健康检查 503 → 杀进程。
        调度器看门狗**不由本端点承担**：I1 的 daily 对账 job 会读 job_runs 里 tick/daily 的 last_success_at 互相监视，
        超期走 error 日志告警（见 AJ-102 / 0.5.4 变更注记；/readyz 与 /healthz 的语义分工见 /readyz 条目）。
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {status: {type: string, example: ok}}}}}}}
  /readyz:
    servers: [{url: 'https://api.example.com', description: '0.6.10：探针挂在根路径，不在 /api/v1 下'}]
    get:
      security: []
      summary: |
        就绪探针（D21）：**查依赖**（当前为 DB `SELECT 1`），不通即 503——平台据此把实例摘出负载均衡。
        与 `/healthz` 的区别是**语义**不是细节：/healthz = 进程活着吗（不查依赖，避免一次 DB 抖动把整个服务重启一轮）；
        /readyz = 能接流量吗（查依赖）。⚠️ Render 的健康检查刻意配 `/healthz` 而**不是** `/readyz`：
        停机摘流（N7）期间 /readyz 会先转 503，若被平台当作健康依据会直接杀进程。
      responses:
        '200': {description: Ready, content: {application/json: {schema: {type: object, properties: {status: {type: string, example: ok}}}}}}
        '503': {description: '不就绪：依赖不可达，或正在停机摘流（N7 等待窗口内持续 503）', content: {application/json: {schema: {type: object, properties: {status: {type: string, example: degraded}}}}}}
  /internal/jobs/daily:
    post:
      security: [{internalSecret: []}]
      summary: 每日作业触发（Render Cron Job 调用）：立即 202，进程内异步执行对账 / 汇率刷新 / 存活校验，结果写 job_runs('daily')（D-45；经 Cloudflare 代理有 100 秒上限，不得同步执行）
      responses: {'202': {description: Accepted, content: {application/json: {schema: {type: object, properties: {run_id: {type: string}, started_at: {type: string, format: date-time}}}}}}, '401': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /home:
    get:
      security: []
      summary: |
        首页数据（D-51）：生效中的 Banner（`active` 且在 starts_at/ends_at 内，按 sort）+ 分类清单。
        @why 免鉴权：首屏首帧就要用，登录态不该挡住"看见这家店卖什么"。
        @why 两块合成一个端点而不是首页打两次：都是首屏首帧要用的，小程序一次请求一次往返；
        分成两个的代价是首屏要么等两次、要么先出一半（banner 后补会把列表往上顶一下）。
        @why 生效判定**只在服务端做一次**（`active` + 时间窗，两端闭区间，starts_at/ends_at 为 null = 该侧不限制）：
        前端拿本机时钟再判一次，时钟偏的用户会看到"该下架的还在 / 该上线的没来"，
        而这种表现是**随机的**——排查不会往时钟方向走（与 FxRate.is_current 同一条口径）。
        @why `categories` 是**分类清单**（shared PRODUCT_CATEGORY 全量），不是"库里有货的分类"：
        后者会让分类栏随商品上下架跳动（用户第二次进来发现少了一个 tab）；
        且 `GET /products?category` 的校验用同一份枚举——两份不一致就会出现"tab 上有、点了 40001"。
        @why 失败**不降级**成 `{banners: []}`：空数组与"取不到"在页面上长得一样，
        吞成空数组等于把一次 DB 故障伪装成"今天没配 banner"，运营会去查配置且永远查不到。
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {banners: {type: array, items: {$ref: '#/components/schemas/Banner'}}, categories: {type: array, items: {type: string}}}}}}}}
  /products:
    get:
      security: []
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 20, maximum: 50}}
        - {name: category, in: query, schema: {type: string, enum: [beauty, daily, kitchen, food]}}
        - {name: keyword, in: query, schema: {type: string}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ProductCard'}}, total: {type: integer}}}}}}}
  /products/{id}:
    get:
      security: []
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}, '404': {$ref: '#/components/responses/Err'}}
  /addresses:
    get: {summary: 我的地址, responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Address'}}}}}}}
    post:
      summary: 新增地址（美国格式，ASCII）
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressInput'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Address'}}}}, '400': {$ref: '#/components/responses/Err'}}
  /addresses/{id}:
    put:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressInput'}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Address'}}}}}
    delete:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Deleted}}
  /orders/quote:
    post:
      summary: 报价（购物车 / 确认页；不落库、不扣库存）
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [items], properties: {items: {$ref: '#/components/schemas/OrderItemsInput'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Quote'}}}}, '409': {$ref: '#/components/responses/Err'}, '429': {$ref: '#/components/responses/Err'}}
  /orders:
    get:
      parameters: [{name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}, description: '按 10 态单词过滤（0.5.5 起双词表统一；旧五值 UI 词的映射见版本说明）'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/OrderSummary'}}}}}}}}
    post:
      summary: 建单（不含支付；扣减 stock；写 fx_snapshot 与 expires_at）
      description: 0.6.11（AJ-179）：REVIEW_MODE=on 时只收 REVIEW_SKU_ID，含其它商品整单 40401；审核期建的单 is_test=true
      parameters: [{$ref: '#/components/parameters/IdemKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [items, address_id, terms_version], properties: {items: {$ref: '#/components/schemas/OrderItemsInput'}, address_id: {type: string}, expected_total_jpy: {type: integer, description: '可选：前端确认页看到的合计；不等则 40905 价格已变动'}, contact_email: {type: string, format: email, description: '可选：收货通知兜底邮箱（D-39）'}, terms_version: {type: string, description: '建单时刻生效的条款版本（如 TOS-2026-09-20）；服务端与 TERMS_VERSION（GET /terms 返回的 version）不一致则 40011，缺失或不匹配一律拒单（D-43）'}}}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/OrderCreated'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '429': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /orders/{id}:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}}
  /orders/{id}/pay:
    post:
      summary: 发起支付（选通道）。同订单同通道未支付期内幂等返回同一意图；换通道先取消旧意图（D-33）。stripe 返回短链 pay_url（D-49），小程序不接收 client_secret
      description: 0.6.9（AJ-175/KD-3）：同一 Idempotency-Key 重放时不产生第二个支付意图、不再调机构，但 `pay_url` 的 token 为**重新签发**（明文 token 不落幂等表），旧链接随之失效；订单已不可付时重放体里的链接落地即 40102
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdemKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [channel], properties: {channel: {type: string, description: '通道 key（D-56/D-59：任意字符串，新增支付方式不需要改本契约、不需要新增路由；前端取值来自 GET /pay/channels 返回的 channel 字段，不写死；不在顶层 x-payment-channels 登记表内即 40001）'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentIntent'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '429': {$ref: '#/components/responses/Err'}, '500': {description: '50001 机构建会话失败（重试或切换支付方式）/ 50003 扣款所需汇率缺失 / 50000 其它', content: {application/json: {schema: {type: object, properties: {code: {type: integer}, message: {type: string}}}}}}}
  /pay/link/{id}:
    get:
      security: []
      summary: 短链落地（D-49）：校验 t=token 与订单状态后 302 到 Stripe Checkout Session URL；token 不符或订单已终态 → 302 到静态失效页（40102）。按 IP 限流；不放行 CORS；不记录 query
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: t, in: query, required: true, schema: {type: string}}]
      responses: {'302': {description: Location = Stripe Checkout Session URL 或失效页}, '429': {$ref: '#/components/responses/Err'}}
  /orders/{id}/cancel:
    post:
      summary: 取消（仅 created / pending_payment；同时取消未完成支付意图）
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/Err'}}
  /admin/orders:
    get:
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
        - {name: keyword, in: query, schema: {type: string, description: order_no / 收件人 / 运单号}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: size, in: query, schema: {type: integer, default: 20, maximum: 100}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AdminOrderListItem'}}, total: {type: integer}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrder'}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/ship:
    post:
      description: 仅 paid；has_dispute=true → 40909；0.6.11（AJ-179）：is_test（审核期测试单）→ 409 / 40902，测试单永不发货
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [carrier, tracking_no], properties: {carrier: {type: string}, tracking_no: {type: string}}}}}}
      responses: {'200': {description: OK}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/refund:
    post:
      description: 订单 has_dispute=true 时拒绝（40907，D-50）；has_dispute=true 时**发货**也拒（40909，AJ-145）。⚠️ 0.6.10① 起 `has_dispute` 的语义是「**有未解除的拒付限制**」（进行中，或已败诉）：拒付结案时**仅胜诉与 withdrawn 复位**、闸门随之解锁，**败诉保持 true、闸门继续拦**（U-F4 / AJ-176；本句取代 0.6.7 的旧口径，那条已作废）。0.6.9（AJ-175/KD-4）：状态为 **refunding**（上次机构调用失败）时允许再调重试，沿用首次退款原因与同一机构幂等键；refunded 仍 40902。0.6.11（AJ-178 / F-03）：上一笔机构退款在途（refund_pending）时再调只查询该笔、不再发起；机构确认失败后换新机构幂等键重新发起；结果未知（超时 / 机构报错）仍沿用同键
      summary: 全额退款（MVP；按 charge_currency / charge_amount 原币退；缺货场景整单退款）
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 500, description: '0.6.12（B7 / AJ-191）：上限 500（机构 metadata 值上限）；超限 40001 + reason refund_reason_too_long。上限唯一真源 = shared REFUND_REASON_MAX_LENGTH，由契约测试双向比对'}}}}}}
      responses: {'202': {description: 'Accepted（succeeded = 已退款，订单 refunded；pending = 机构处理中，订单停在 refunding，再调即查询）', content: {application/json: {schema: {type: object, required: [order_id, outcome], properties: {order_id: {type: string}, outcome: {type: string, enum: [succeeded, pending]}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/dispute/release:
    post:
      summary: 人工解除拒付限制（B1b / AJ-194，逃生口）
      description: 把 orders.has_dispute 由 true 置回 false，解锁发货（40909）与退款（40907）。⚠️ **不碰 payments.dispute_***：解除的是"限制"不是"事实"，拒付记录照旧留在风控列表。0.6.14（AJ-194）：已没锁的订单返回 **409 / 40902** dispute_not_locking（不是幂等 200——静默成功会让"点错单号"变成看不见的事故）；成功写 admin_audit（含改前值）与 order_events(status=dispute_released)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 500, description: '0.6.22（AJ-291）：解除理由必填（进审计台账与订单时间线）；上限 500 字，唯一真源 = shared ADMIN_NOTE_MAX_LENGTH（管理端补上 UI 后前端也需要它，故从服务端 domain 移入 shared）。⚠️ 与退款理由的 500 **同值不同源**：那条是机构 metadata 的硬上限，不可互相引用'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [order_id, has_dispute], properties: {order_id: {type: string}, has_dispute: {type: boolean}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /admin/orders/{id}/address:
    post:
      summary: 发货前改址（仅 paid 未发货；重写 address_snapshot 并记 order_events，D-39）
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressInput'}}}}
      responses: {'200': {description: OK}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}}
  /admin/products:
    get:
      summary: 商品列表（管理端；status 非法或 page/size 非法 → 40001）
      parameters: [{name: status, in: query, schema: {type: string, enum: [active, offline]}}, {name: page, in: query, schema: {type: integer, default: 1}}, {name: size, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 100}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AdminProduct'}}, total: {type: integer}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
    post:
      summary: 管理员建商品（响应带 id：前端用它打后续的 PUT /{id}）
      description: 0.6.6 补：上架校验命中任一条即 40001（见 ProductInput.compliance_tags 的七禁标签与 customs_desc_en 词表；weight_g / price_jpy 也在此校验）
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductInput'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/AdminProduct'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/products/{id}:
    put:
      summary: 更新商品字段（**不改上下架状态**；stock 省略即不改）；带**乐观锁**：expected_updated_at 对不上 → **40914**
      description: 0.6.9：上下架只走 PATCH `/status`，本接口不碰 status（原实现会把已下架商品悄悄改回 active）；stock 省略即保持当前库存（AJ-175）。0.6.6 补：🈲 不存在的 id **不得**返回 200——那会让运营以为改成功了、实际什么都没改（静默失败）。与 `/admin/banners/{id}` 的 PUT 同口径（40402）。0.6.18 补：请求体**必须**带 `expected_updated_at`（编辑页打开时那一行的 `updated_at`，由 `GET /admin/products` 下发），服务端按它做乐观锁；对不上时**整行不写**并回 409 / 40914（不是 40401：商品在，只是版本不是你看到的那一版）。缺该字段或不是合法时间 → 400 / 40001，**不退化成无锁覆盖**
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ProductInput'}, {type: object, required: [expected_updated_at], properties: {expected_updated_at: {type: string, format: date-time, description: '乐观锁凭据：编辑页打开时该行的 AdminProduct.updated_at（ISO 8601）。与库里当前值（按毫秒截断比较）不一致 → 409 / 40914'}}}]}}}}
      responses: {'200': {description: 'OK（回整行 AdminProduct：与 Banner PUT 的空体不同，这里实现本就回整行，前端据此刷新表单）', content: {application/json: {schema: {$ref: '#/components/schemas/AdminProduct'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/products/{id}/status:
    patch:
      summary: 上架 / 下架；id 不存在 → **40401**
      description: 0.6.6 补：status 只收 active / offline，其它值 40001；0 行命中一律 40401（不静默 200）
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {status: {type: string, enum: [active, offline]}}}}}}
      responses: {'200': {description: 'OK（回 {id, status}：让前端不必为了确认结果再拉一次列表）', content: {application/json: {schema: {type: object, properties: {id: {type: string}, status: {type: string, enum: [active, offline]}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/upload:
    post:
      summary: 图片上传（multipart，服务端写对象存储并生成 thumb/card/detail 三档 webp；响应 ImageSet 增带 image_key = detail 档键）
      description: 0.6.8 补：单文件上限 **10MB**；只收 jpeg / png / webp，按 **magic bytes** 判定（不信客户端 Content-Type；svg 永不放行，heic 明拒）。类型不符 / 超限 → 40001。`image_key` 供 BannerInput 使用（AJ-143）
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, properties: {file: {type: string, format: binary}}}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ImageSet'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/fx:
    get:
      summary: 展示汇率列表（**含历史与未来生效行**；quote 升序、同币种内 effective_from 倒序；逐行带 is_current）
      description: 0.6.3 更正——旧文案「当前生效」会让人以为只返回已生效的行；实际不过滤，否则刚提交的未来汇率在列表里消失，运营会以为没保存成功（AJ-150 ①）。排序保证每个币种最新一行排在最上面。0.6.19 补：每行带 `is_current`（服务端时钟判定，同币种至多一行 true）——"哪一行正在起作用"由服务端标注，消费方不得拿本机时钟推断（ADM3-05）
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/FxRate'}}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
    post:
      summary: 管理员维护展示汇率（**追加一行**；rate 由服务端按 raw_rate × (1 + FX_BUFFER_RATE) 算出，不收 rate）
      description: 同币种同一生效时间重复提交 → 40910（UNIQUE(quote, effective_from)）；改前值与 10 倍以上的突变只进日志，不拦截（AJ-148 ④）
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [quote, raw_rate], properties: {quote: {type: string, enum: [CNY, USD]}, raw_rate: {type: number, exclusiveMinimum: 0, maximum: 1000}, effective_from: {type: string, format: date-time, description: '缺省 = 立即生效（服务端取当前时间）'}}}}}}
      responses: {'201': {description: 'Created（无响应体：契约没定义 body，前端保存后重新 GET）'}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/shipping-rates:
    get:
      summary: 运费分档全表（含停用档；carrier 升序、同承运商内 max_weight_g 升序）
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ShippingRate'}}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
    put:
      summary: 整表替换运费分档（**事务内** delete + insert；中途失败整表回滚）
      description: 🔴 启用的承运商必须**恰好一家**——否则 resolveSingleActiveCarrier() ≠1 家 → 全站 50004 无法报价（AJ-148 ③）。空表 / 重复档 / 全停用同样 40001。无响应体（契约没定义 body）
      requestBody: {required: true, content: {application/json: {schema: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ShippingRate'}}}}}
      responses: {'200': {description: 'OK（无响应体：前端保存后重新 GET）'}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/banners:
    get:
      summary: Banner 列表（D-51；**全量**：含停用与未开始的，不过滤时间窗）
      description: 0.6.4 补：只返回"当前生效"的话，"停用"就等于永久删除视图——运营再也找不到它来重新启用。"当前该展示哪些"是买家侧 /home 的判定，不是本接口的职责
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Banner'}}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
    post:
      summary: 新建 Banner（**响应必须带 id**：前端用它打后续的 PUT /{id}）
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BannerInput'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Banner'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/banners/{id}:
    put:
      summary: 全量更新（整行覆盖）；id 不存在 → **40402**
      description: 🈲 不存在的 id **不得**返回 200——那会让运营以为改成功了、实际什么都没改（静默失败）。DELETE 则相反：幂等 204
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BannerInput'}}}}
      responses: {'200': {description: 'OK（无响应体）'}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
    delete:
      summary: 删除（**幂等**：不存在的 id 也 204）
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Deleted}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/disputes:
    get:
      summary: 拒付列表（D-50）：payments.dispute_status；证据在 Stripe Dashboard 提交，后台只标红、锁退款、拉黑
      description: 0.6.5 补：只出**带 dispute_id 的支付行**（无拒付的支付行不出现）；按开案时间倒序（NULL 最后）。`status` 非法 → **40001**，🈲 不得静默当成"不过滤"——那会让运营看到列表突然变长、按"拒付激增"这个错的结论去查业务
      parameters: [{name: status, in: query, schema: {type: string, enum: [open, won, lost, withdrawn]}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Dispute'}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/users/{id}/block:
    post:
      summary: 拉黑用户（D-50）：users.blocked_at；此后**所有买家鉴权接口** 40301（0.6.10 更正：不只建单）
      description: 0.6.5 补：**不可逆**（契约没有解除接口），前端必须二次确认。id 不存在 → **40403**；对方是管理员 → **40911**（拉黑管理员 = 把自己锁在后台门外）。已拉黑的账号重复调用 → 200 幂等，不刷新 blocked_at。⚠️ 0.6.15（B28 / AJ-213）：**连带取消该用户的在途单**（created / pending_payment → cancelled，同事务回补库存 + 作废旧支付行 + 发 order.cancelled）；已付单不碰，取消后到账的钱按迟到付款 40902 处理。无响应体
      # 0.6.21：可选的订单凭据。带了就核对归属（409 / 40915），不带不加约束。@see info 0.6.21 ①
      requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {order_id: {type: string, description: '发起这次拉黑的那一单（风控页点"处理"的那一单）。带了就由服务端核对它属于 {id} 这个用户；不属于或该单不存在 → 409 / 40915，整条请求不写'}}}}}}
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'OK（无响应体：前端拉黑后重新拉列表）'}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /pay/channels:
    get:
      security: []
      summary: 可用支付通道（F11/ADR-28）：按 (目的国, 币种, 金额 JPY) 过滤并按 priority 排序。**前端据此渲染支付入口，不写死通道名与按钮**——下线一个通道改配置即可，无需发版
      parameters:
        - {name: country, in: query, required: true, schema: {type: string, pattern: '^[A-Z]{2}$'}, description: 目的国 ISO 3166-1 alpha-2；必填（服务端不给默认值，避免把国家写死）}
        - {name: currency, in: query, required: true, schema: {type: string, pattern: '^[A-Z]{3}$'}, description: 扣款币种 ISO 4217}
        - {name: amount_jpy, in: query, required: true, schema: {type: integer, minimum: 1}, description: 订单金额（JPY 整数円，ADR-09 唯一定价锚）}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ChannelView'}}}}}}}, '400': {$ref: '#/components/responses/Err'}}
  /pay/callback/{channel}:
    post:
      security: []
      summary: '**统一回调入口**（F11/ADR-28）：channel 为路径参数（mock / wechat / stripe…，新增通道不再新增路由）。验签与报文解析由该通道的 Provider 自己完成（raw body 原文）。响应范式（D5/D6）：业务冲突（单不存在且在宽限期内 → 503 让机构重发；超过宽限期 / 状态不符 → 200 + 我方告警）绝不回 4xx / 5xx——机构对任何非 2xx 都会重发，而这类冲突重发一万次也不会变；只有验签失败（40103）、报文不可解析（40001）与未登记的通道（40001）才回 4xx'
      parameters: [{name: channel, in: path, required: true, schema: {type: string}}]
      # ⚠️ 各通道登记的事件清单。契约只登记"会收到什么"，**不描述怎么解析**（那是 Provider 的事）。
      #    用处：test/factories/stripe.contract.test.ts 从这里抽事件名，断言样本工厂造得出来——
      #    于是"假数据形状 vs 契约声明"的脱节会在 gate 里变红，而不是等到联调。
      #    @limitation 目前只有 stripe 一条；新增通道在此登记，样本工厂同步补。
      x-provider-events:
        stripe: checkout.session.completed / checkout.session.expired / checkout.session.async_payment_succeeded / checkout.session.async_payment_failed / payment_intent.succeeded / payment_intent.payment_failed / payment_intent.canceled / charge.refunded / refund.updated / refund.failed / charge.dispute.created / charge.dispute.closed / charge.dispute.funds_withdrawn / charge.dispute.funds_reinstated（D-49/D-50）
      responses:
        '200': {description: '已收下；body 形如 {received: true, order_id}（重复投递带 duplicate:true，未落业务状态带 ignored:<outcome|unmatched|paid:already|status_conflict|late_payment|settlement_mismatch>）'}
        '400': {$ref: '#/components/responses/Err'}
        '401': {$ref: '#/components/responses/Err'}
        '503': {description: '暂未处理：already_processing（另一请求在处理中）或 order_not_found_yet（回调早到、宽限期内）；带 Retry-After'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    internalSecret: {type: apiKey, in: header, name: X-Internal-Job-Secret, description: 与 INTERNAL_JOB_SECRET 相等；仅 /internal/* 使用，不放行 CORS 与小程序}
  parameters:
    IdemKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128, description: '客户端段上限 128 字符（0.6.0②）；超限 40001 + reason idempotency_key_too_long'}}
  responses:
    Err: {description: 业务错误, content: {application/json: {schema: {type: object, properties: {code: {type: integer}, message: {type: string}}}}}}
  schemas:
    AuthResp: {type: object, properties: {token: {type: string}, user: {type: object, properties: {id: {type: string}, isAdmin: {type: boolean}}}}}
    Display: {type: object, description: 展示价，整数分（后端按当日汇率计算）, properties: {USD: {type: integer}, CNY: {type: integer}}}
    ImageSet: {type: object, properties: {thumb: {type: string}, card: {type: string}, detail: {type: string}, image_key: {type: string, description: '仅 POST /admin/upload 响应里出现（0.6.8）：detail 档存储键，供 BannerInput.image_key 使用（AJ-143/AJ-166）；存量 Product.images 条目没有它'}}}
    ProductCard: {type: object, properties: {id: {type: string}, title: {type: string}, category: {type: string}, price_jpy: {type: integer}, display: {$ref: '#/components/schemas/Display'}, image: {$ref: '#/components/schemas/ImageSet'}, stock: {type: integer}, status: {type: string},
               why: {type: string, maxLength: 200, description: '0.6.23：编辑口径的"为什么值得买"（一句带判断的话）。可选；**缺失 = 编辑还没撰写**，前端降级为不含 why 的形态，不用通用话术顶上'},
               maker: {type: string, maxLength: 120, description: '0.6.23：产地 / 工房 / 匠人署名。可选；缺失时前端不渲染这一行'},
               tags: {type: array, items: {type: string}, description: '0.6.23：编辑展示标签（自由文案，给买家看）。⚠️ 与 compliance_tags（能不能寄，封闭枚举）分工不同，不可混填'}}}
    Product: {description: '商品详情。实现不返回 ProductCard.image（缩略图只在列表卡片用，详情用 images）；AdminProduct 另不返回 display / image（0.6.10 ⑦）', allOf: [{$ref: '#/components/schemas/ProductCard'}, {type: object, properties: {description: {type: string}, images: {type: array, items: {$ref: '#/components/schemas/ImageSet'}}, weight_g: {type: integer}, compliance_tags: {type: array, items: {type: string}}, hs_code: {type: string}, customs_desc_en: {type: string}, origin_country: {type: string}, ship_within_business_days: {type: integer, minimum: 1, maximum: 30, description: '0.6.11（AJ-180）：发货时限承诺（付款后 N 个工作日内发出，FTC / D-39⑦）；店铺级配置 SHIP_WITHIN_BUSINESS_DAYS'}}}]}
