    OrderListItem: {description: '0.6.49（AJ-408）：买家 GET /orders 的列表行', allOf: [{$ref: '#/components/schemas/OrderSummary'}, {type: object, required: [item_count, line_count, after_sale_state, expires_at], properties: {expires_at: {type: string, format: date-time, description: '0.6.61（AJ-435）：付款截止，与 Order.expires_at 同列同格式；恒下发'}, payment_dispute: {type: string, enum: [open, lost], description: '0.6.82（AJ-500）：拒付状态——open 买家的银行正在处理争议（暂不发货），lost 银行已把这笔钱退回买家（订单不发货）；没有拒付或胜诉 / 撤回后省略'}, item_count: {type: integer, minimum: 0, description: '各行 qty 之和（共 N 件），不是行数'}, line_count: {type: integer, minimum: 0, description: '0.6.88：行数 = 几种商品（>1 时小程序写"首件名 等 N 种商品"）'}, after_sale_state: {type: string, nullable: true, enum: [open, closed, null], description: '0.6.60（AJ-430）：open = 有进行中（open / processing）的售后申请；closed = 只有已结案的；null = 没有售后申请。恒下发'}, first_image: {$ref: '#/components/schemas/ImageSet', description: '买家下单顺序第一行商品的现图第一张（同 Order.items[].image 的生成规则）；没有 → 整键省略'}, first_title: {type: string, description: '0.6.54（AJ-416）：第一行的下单快照标题（不随商品改名变化）；没有 → 整键省略'}}}]}
    Order: {allOf: [{$ref: '#/components/schemas/OrderSummary'}, {type: object, properties: {contact_email: {type: string, format: email, description: '可选收货通知邮箱（D-42 补入）'}, terms_version: {type: string, description: '建单时写入的条款版本（只读，D-43）'}, items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}, address: {$ref: '#/components/schemas/Address'}, items_jpy: {type: integer}, shipping_jpy: {type: integer}, duty_jpy: {type: integer, nullable: true, description: '0.6.30：null = 无法估算（与 Quote.duty_jpy 同口径；此前存 0）'}, expires_at: {type: string, format: date-time}, carrier: {type: string}, tracking_no: {type: string}, tracking_url: {type: string, description: '0.6.32：官方查件链接（日本邮便 S10 单号或承运商为日本邮便时生成，locale=en）；认不出 → 整键省略'}, timeline: {type: array, description: '0.6.10：只含订单状态值（OrderStatus 10 态）；管理事件只在 AdminOrder.events', items: {type: object, properties: {status: {type: string}, at: {type: string, format: date-time}}}}, payment: {type: object, properties: {channel: {type: string}, charge_currency: {type: string}, charge_amount: {type: integer, description: '**最小货币单位**（JPY=円，USD=分）：$86.00 存 8600。展示层必须除以 10^小数位（B43 / AJ-214）'}, paid_amount: {type: integer}, paid_currency: {type: string}}}, late_paid: {type: boolean, description: '0.6.37（P2-11 / AJ-386）：关单后才到的付款（钱已扣）。买家侧据此说"已收到付款，会原路退回"，而不是"未完成付款，请重新下单"'}, payment_dispute: {type: string, enum: [open, lost], description: '0.6.82（AJ-500）：拒付状态——open 买家的银行正在处理争议（暂不发货），lost 银行已把这笔钱退回买家（订单不发货）；没有拒付或胜诉 / 撤回后省略'}, partial_refunds: {type: array, description: '0.6.37（P2-12 / AJ-386）：买家视角的部分退款（按发起顺序；没有时为空数组）。AdminOrder 覆盖为带原因 / 操作人的 PartialRefund[]', items: {$ref: '#/components/schemas/BuyerPartialRefund'}}, after_sale: {$ref: '#/components/schemas/AfterSaleRequest', description: '0.6.56（AJ-420）：最新一条售后申请；没有 → 整键省略（AdminOrder 不带本键，看 after_sales）'}}}]}
    AfterSaleRequest: {type: object, description: '0.6.56（AJ-420）：一条售后申请（买家视角）。原因 / 状态的中文文案在 shared AFTER_SALE_REASON_LABELS / AFTER_SALE_STATUS_LABELS', required: [id, reason, description, status, created_at, updated_at], properties: {id: {type: string}, reason: {type: string, enum: [not_received, damaged, wrong_item, quality, other]}, description: {type: string, maxLength: 500}, status: {type: string, enum: [open, processing, resolved, rejected]}, resolution_note: {type: string, maxLength: 500, description: '运营的处理说明；没有 → 整键省略'}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}}
