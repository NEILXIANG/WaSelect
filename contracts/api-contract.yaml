      description: '立即生效、不用重启。停售中报价 / 建单 / 发起支付返回 40916；回调、退款、发货、查询不受影响。原因必填（进审计，改前状态记 before）。'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [paused, reason], properties: {paused: {type: boolean}, reason: {type: string, maxLength: 500}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SalesPause'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/users/{id}/block:
    post:
      summary: 拉黑用户（D-50）：users.blocked_at；此后**所有买家鉴权接口** 40301（0.6.10 更正：不只建单）
      description: 0.6.5 补：**不可逆**（契约没有解除接口），前端必须二次确认。id 不存在 → **40403**；对方是管理员 → **40911**（拉黑管理员 = 把自己锁在后台门外）。已拉黑的账号重复调用 → 200 幂等，不刷新 blocked_at。⚠️ 0.6.15（B28 / AJ-213）：**连带取消该用户的在途单**（created / pending_payment → cancelled，同事务回补库存 + 作废旧支付行 + 发 order.cancelled）；已付单不碰，取消后到账的钱按迟到付款 40902 处理。无响应体
      # 0.6.21：可选的订单凭据。带了就核对归属（409 / 40915），不带不加约束。@see info 0.6.21 ①
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 500, description: '0.6.66（AJ-449）：拉黑原因**必填**（去首尾空白后 1–500 字，shared ADMIN_NOTE_MAX_LENGTH），空 → 40001；进 admin_audit，连带取消的订单事件 note 记「拉黑：<原因>」、actor = admin:<操作人>（此前写死 admin:block）'}, order_id: {type: string, description: '发起这次拉黑的那一单（风控页点"处理"的那一单）。带了就由服务端核对它属于 {id} 这个用户；不属于或该单不存在 → 409 / 40915，整条请求不写'}}}}}}
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 'OK（无响应体：前端拉黑后重新拉列表）'}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}, '409': {$ref: '#/components/responses/Err'}, '500': {$ref: '#/components/responses/Err'}}
  /admin/customers:
    get:
      summary: 客户列表（0.6.47 / AJ-404；只读）
      description: '客户 = 非管理员用户（含只登录过、没下过单的）。统计一律排除测试单，口径见 info 0.6.47 ①。keyword 匹配订单号 / 联系邮箱 / 订单收件人 / 地址簿收件人 / 用户 id（字面子串、不区分大小写，含测试单）。参数不合法 → 40001。'
      parameters: [{name: keyword, in: query, schema: {type: string, maxLength: 64}}, {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}, {name: sort, in: query, schema: {type: string, enum: [last_order_at, '-last_order_at', paid_total_jpy, '-paid_total_jpy']}, description: '0.6.53：排序（-前缀 = 降序）；不传 = 最近下单倒序；last_order_at 两个方向都把没下过单的排最后；白名单外 → 40001 sort_invalid'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [items, total], properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/AdminCustomerListItem'}}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/customers/{id}:
    get:
      summary: 客户详情（0.6.47 / AJ-404；只读，不下发 openid）
      description: '不存在或是管理员 → 40403。拉黑 / 解除走 POST /admin/users/{id}/block|unblock。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCustomer'}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}}
  /admin/customers/{id}/events:
    delete:
      summary: 删除该客户的全部用户行为记录（0.6.51 / AJ-413；APPI「用户要求删除」的后台路径）
      description: '只删 `user_events` 里 user_id = {id} 的行（不论多旧）；订单 / 地址 / 审计不动（AJ-292）。reason 必填（1–500 字；缺 / 空 / 超长 → 40001 purge_reason_required / purge_reason_too_long），写进 admin_audit.after。不存在或管理员 → 40403。没有记录也回 200 {deleted: 0}。180 天保留期清理由 daily 作业自动做，不经此接口。'
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 500, description: '为什么删（如：买家 2026-10-09 邮件要求删除）；进审计'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [deleted], properties: {deleted: {type: integer, description: 删除的行数（0 = 本来就没有）}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}, '404': {$ref: '#/components/responses/Err'}}
  /admin/settings:
    get:
      summary: 当前生效的非密钥配置（0.6.47 / AJ-404；只读）
      description: '白名单制；通知类（邮件 / 告警邮箱 / Sentry）只给"是否已配置"布尔；任何密钥的值、片段与变量名都不下发。source=env 的项改了要重启；source=db 的项按 apply 标注（运费 / 汇率 / 关税率立即生效）。'
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSettings'}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/audit:
    get:
      summary: 运营日志——管理员操作审计分页（0.6.32，剩余清单 3-2）
      description: 按 created_at 倒序。`actor` / `target` 精确过滤（非字符串或空串 → 40001，不静默当成"不过滤"）。🈲 不下发 before / after（改动前后的业务快照可能含地址等业务数据；要看细节去库里按 id 查）。只读：审计表 append-only。
      parameters: [{name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}, {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}, {name: actor, in: query, schema: {type: string}, description: '如 admin:u-xxx / cli:admin-create；0.6.40 起含 @ 时按管理员邮箱筛'}, {name: target, in: query, schema: {type: string}, description: '0.6.84：认四种写法——内部 id、订单号（兼收小写）、商品名（整名相同）、账号邮箱（不分大小写）；都是整串相等，不做模糊'}, {name: created_from, in: query, schema: {type: string, format: date}, description: '0.6.53：操作日期下界，JST 日历日 YYYY-MM-DD（含当日）；非法 → 40001'}, {name: created_to, in: query, schema: {type: string, format: date}, description: '0.6.53：操作日期上界，JST 日历日（含当日）；早于下界 → 40001'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [total, items], properties: {total: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/AdminAuditEntry'}}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/exports/{kind}:
    get:
      summary: CSV 导出（0.6.32，剩余清单 3-3）——orders 订单总表 / purchase 待采购清单 / customs 待发货报关
      description: '0.6.77（AJ-495）：下列表头里的金额单位「円」改为「日元」，其余不变。0.6.76（AJ-494）：orders / purchase 中文表头（订单总表：订单号, 状态, 下单时间（日本时间）, 付款时间（日本时间）, 发货时间（日本时间）, 商品金额（日元）, 运费（日元）, 预估关税（日元）, 订单合计（日元）, 收件人, 州, 国家, 承运商, 运单号, 实付币种, 实付金额, 已退金额（0.6.89：整单已退 = 实付，否则 = 成功的部分退款之和，币种同实付）；状态写中文。采购单：订单号, 付款时间（日本时间）, 商品名, 日文原名, JAN 码, 采购来源, 数量, 单价（日元）, 单件成本（日元）, 备注, 商品编号（系统）——0.6.89 起两列金额改名写明单件、加备注列）；customs 仍为英文蛇形表头（报关代理共用）：weight_g 是**单件**重量、declared_value_usd 是**整行**申报价，0.6.89 起末尾加 line_weight_g（整行重量 = 单件 × qty），原有列名与位置不变。0.6.37（P1-8 / AJ-386）：时间列名 created_at_jst / paid_at_jst / shipped_at_jst（customs 及 0.6.76 前的 orders / purchase），值为 JST `YYYY-MM-DD HH:mm:ss`；邮编 / 电话 / HS / JAN / 运单号的纯号码值输出为 `="…"`（Excel 不再吃掉前导零、不转科学计数）。响应是 JSON（filename + csv 字符串，csv 以 UTF-8 BOM 开头、CRLF 行尾、以 = + - @ 开头的文本前加单引号防公式注入），由前端存成文件。一律排除 is_test。purchase / customs 固定只出 paid 的单（0.6.89：customs 另排除 has_dispute）（一行一个行项目，取下单时快照；快照缺失的历史行用商品当前值并在 snapshot 列标 current）；orders 可按 status 过滤。kind 非三者之一或 status 非法 → 40001。⚠️ 含收件地址等 PII：每次导出写一条 admin_audit（target = kind，after.rows = 行数）。'
      parameters: [{name: kind, in: path, required: true, schema: {type: string, enum: [orders, purchase, customs]}}, {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}, description: '仅 kind=orders 生效'}, {name: order_ids, in: query, schema: {type: string}, description: '0.6.48（AJ-407）：导出所选——逗号分隔的订单内部 id，去重后 1–100 个；与其它条件 AND（purchase / customs 仍只出 paid，测试单不出，未知 id 不出）。非法 → 40001 order_ids_invalid / order_ids_too_many'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [filename, csv], properties: {filename: {type: string, description: '<kind>-YYYYMMDD.csv'}, csv: {type: string}}}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/reconciliation/latest:
    get:
      summary: 运营日志——最近一次每日对账结果（0.6.32，剩余清单 3-2）
      description: 每日对账每跑一次追加一行（迁移 028，append-only）；这里取最近一行。没跑过 → run 为 null。`counts` 为各类异常计数（零异常也有键），`samples` 只含计数大于 0 的类、每类最多 20 个 id。
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, required: [run], properties: {run: {nullable: true, type: object, properties: {ran_at: {type: string, format: date-time}, counts: {type: object, additionalProperties: {type: integer}}, samples: {type: object, additionalProperties: {type: array, items: {type: string}}}, sample_orders: {type: object, description: '0.6.87：取样 → 所属订单（订单 / 支付编号及 order.paid:、evt_late_ 前缀的键）；查不到的不带。给运营显示订单号用', additionalProperties: {type: object, required: [order_id, order_no], properties: {order_id: {type: string}, order_no: {type: string}}}}}}}}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/dashboard/sales:
    get:
      summary: 工作台销售统计（0.6.41 / AJ-393）——今日与近 7 日
      description: '只读聚合，供管理端首页工作台卡片使用。**一律排除测试单**（is_test）。窗口左闭右开、两端取 JST 日界，右端恒为"明日 00:00"（同一天内刷新数字不变，`today` ⊆ `last7` 恒成立）。`orders` 按 created_at 落窗；`paid_orders` / `sales_jpy` / `avg_jpy` 按 **paid_at** 落窗（sales_jpy = 窗口内收款订单的 total_jpy 合计，円）。`received` / `refunded` / `disputed` 按**实际扣款币种分行、原样不折算**（§8-2：这三个数要与支付机构对账）。`refunded` 的两个来源相加：全额退款只改订单状态机、不写 order_refunds，部分退款只取 succeeded 行且该单当前非 refunded（否则"先部分退 X 再全额退"时 X 被算两遍）。`disputed` 是机构报的 dispute_amount，按开案时间落窗。`fx` 为当日生效的 USD 展示汇率（含缓冲），**没有已生效汇率时整键省略**——前端据此不显示 ≈USD 那一行。'
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSalesOverview'}}}}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /admin/dashboard/funnel:
    get:
      summary: 工作台转化漏斗（0.6.62 / AJ-438）——近 1 / 7 / 30 天六步人数
      description: '只读聚合。窗口左闭右开、两端取 JST 日界（同 /admin/dashboard/sales）。六步按人去重（有 user_id 用 user_id；没有的借同一设备 session 在窗口内登录过的 user_id；都没有算匿名设备），每一步只数上一步也到过的人；"有购买意向"= add_to_cart 或 checkout_enter（立即购买不经过购物车）；"付款成功"= pay_start 所带订单 paid_at 非空且非测试单。只看窗口内到没到过，不看先后顺序。'
      parameters: [{name: days, in: query, required: false, schema: {type: integer, enum: [1, 7, 30], default: 7}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AdminFunnel'}}}}, '400': {$ref: '#/components/responses/Err'}, '401': {$ref: '#/components/responses/Err'}, '403': {$ref: '#/components/responses/Err'}}
  /pay/channels:
    get:
      security: []
      summary: 可用支付通道（F11/ADR-28）：按 (目的国, 币种, 金额 JPY) 过滤并按 priority 排序。**前端据此渲染支付入口，不写死通道名与按钮**——下线一个通道改配置即可，无需发版
      parameters:
        - {name: country, in: query, required: true, schema: {type: string, pattern: '^[A-Z]{2}$'}, description: 目的国 ISO 3166-1 alpha-2；必填（服务端不给默认值，避免把国家写死）}
        - {name: currency, in: query, required: true, schema: {type: string, pattern: '^[A-Z]{3}$'}, description: 扣款币种 ISO 4217}
        - {name: amount_jpy, in: query, required: true, schema: {type: integer, minimum: 1}, description: 订单金额（JPY 整数円，ADR-09 唯一定价锚）}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ChannelView'}}}}}}}, '400': {$ref: '#/components/responses/Err'}}
  /pay/callback/{channel}:
    post:
      security: []
      summary: '**统一回调入口**（F11/ADR-28）：channel 为路径参数（mock / wechat / stripe…，新增通道不再新增路由）。验签与报文解析由该通道的 Provider 自己完成（raw body 原文）。响应范式（D5/D6）：业务冲突（单不存在且在宽限期内 → 503 让机构重发；超过宽限期 / 状态不符 → 200 + 我方告警）绝不回 4xx / 5xx——机构对任何非 2xx 都会重发，而这类冲突重发一万次也不会变；只有验签失败（40103）、报文不可解析（40001）与未登记的通道（40001）才回 4xx'
      parameters: [{name: channel, in: path, required: true, schema: {type: string}}]
      # ⚠️ 各通道登记的事件清单。契约只登记"会收到什么"，**不描述怎么解析**（那是 Provider 的事）。
      #    用处：test/factories/stripe.contract.test.ts 从这里抽事件名，断言样本工厂造得出来——
      #    于是"假数据形状 vs 契约声明"的脱节会在 gate 里变红，而不是等到联调。
      #    @limitation 目前只有 stripe 一条；新增通道在此登记，样本工厂同步补。
      x-provider-events:
        stripe: checkout.session.completed / checkout.session.expired / checkout.session.async_payment_succeeded / checkout.session.async_payment_failed / payment_intent.succeeded / payment_intent.payment_failed / payment_intent.canceled / charge.refunded / refund.updated / refund.failed / charge.dispute.created / charge.dispute.closed / charge.dispute.funds_withdrawn / charge.dispute.funds_reinstated（D-49/D-50）
      responses:
        '200': {description: '已收下；body 形如 {received: true, order_id}（重复投递带 duplicate:true，未落业务状态带 ignored:<outcome|unmatched|paid:already|status_conflict|late_payment|settlement_mismatch>）'}
        '400': {$ref: '#/components/responses/Err'}
        '401': {$ref: '#/components/responses/Err'}
        '503': {description: '暂未处理：already_processing（另一请求在处理中）或 order_not_found_yet（回调早到、宽限期内）；带 Retry-After'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    internalSecret: {type: apiKey, in: header, name: X-Internal-Job-Secret, description: 与 INTERNAL_JOB_SECRET 相等；仅 /internal/* 使用，不放行 CORS 与小程序}
  parameters:
    IdemKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128, description: '客户端段上限 128 字符（0.6.0②）；超限 40001 + reason idempotency_key_too_long'}}
  responses:
    Err: {description: 业务错误, content: {application/json: {schema: {type: object, properties: {code: {type: integer}, message: {type: string}, data: {type: object, description: '0.6.33：可对外的结构化数据（只有抛错处显式标注的字段）。40401 / 40901（报价与建单）带 product_id 指出是哪一件（剩余清单 4-7）；50300 带 retry_after_ms。0.6.73（AJ-488）：管理端商品新建 / 编辑的 40001 带 field / reason / count（第一个出错的字段、原因码、出错总数），price_too_large 时另带 limit（售价上限，円）。0.6.75（AJ-493）：报价的 40901 另带 stock（当前可买件数）。0.6.79（AJ-498）：地址的 40002 带 field（出错字段）与可选 reason（zip_state_mismatch）', properties: {product_id: {type: string}, stock: {type: integer, minimum: 0}, retry_after_ms: {type: integer}, field: {type: string}, reason: {type: string}, count: {type: integer}, limit: {type: integer}}}}}}}}
  schemas:
    AuthResp: {type: object, properties: {token: {type: string}, user: {type: object, properties: {id: {type: string}, isAdmin: {type: boolean}}}}}
    Display: {type: object, description: 展示价，整数分（后端按当日汇率计算）, properties: {USD: {type: integer}, CNY: {type: integer}}}
    ImageSet: {type: object, properties: {thumb: {type: string}, card: {type: string}, detail: {type: string}, image_key: {type: string, description: '仅 POST /admin/upload 响应里出现（0.6.8）：detail 档存储键，供 BannerInput.image_key 使用（AJ-143/AJ-166）；存量 Product.images 条目没有它'}, image_id: {type: string, description: '0.6.28（AJ-361）：仅 POST /admin/upload 响应里出现。三档的**共同主键**（img/{image_id}/{tier}.webp），供 Product.images 存它而不是存完整 URL——业务表不存存储位置（与 Banner 存 image_key 同一条理由）。读路径用它生成三档键，不由消费方拼字符串。0.6.29 起**也**出现在 AdminProduct.images[]（该条目按 id 存时），供编辑页回存；买家侧响应不出现它'}}}
    ProductCard: {type: object, properties: {id: {type: string}, title: {type: string}, category: {type: string}, price_jpy: {type: integer}, display: {$ref: '#/components/schemas/Display'}, image: {$ref: '#/components/schemas/ImageSet'}, stock: {type: integer}, status: {type: string},
               why: {type: string, maxLength: 200, description: '0.6.23：编辑口径的"为什么值得买"（一句带判断的话）。可选；**缺失 = 编辑还没撰写**，前端降级为不含 why 的形态，不用通用话术顶上'},
               maker: {type: string, maxLength: 120, description: '0.6.23：产地 / 工房 / 匠人署名。可选；缺失时前端不渲染这一行'},
               tags: {type: array, items: {type: string}, description: '0.6.23：编辑展示标签（自由文案，给买家看）。⚠️ 与 compliance_tags（能不能寄，封闭枚举）分工不同，不可混填'}}}
    Product: {description: '商品详情。实现不返回 ProductCard.image（缩略图只在列表卡片用，详情用 images）；AdminProduct 另不返回 display / image（0.6.10 ⑦）', allOf: [{$ref: '#/components/schemas/ProductCard'}, {type: object, properties: {description: {type: string, nullable: true, description: '0.6.65：未填为 null'}, images: {type: array, items: {$ref: '#/components/schemas/ImageSet'}}, weight_g: {type: integer}, compliance_tags: {type: array, items: {type: string}}, hs_code: {type: string, nullable: true, description: '0.6.65：未填为 null'}, customs_desc_en: {type: string, nullable: true, description: '0.6.65：未填为 null'}, origin_country: {type: string}, ship_within_business_days: {type: integer, minimum: 1, maximum: 30, description: '0.6.11（AJ-180）：发货时限承诺（付款后 N 个工作日内发出，FTC / D-39⑦）；店铺级配置 SHIP_WITHIN_BUSINESS_DAYS'}}}]}
    AdminProduct: {description: '0.6.11：不返回 ship_within_business_days（店铺级配置，只随买家商品详情下发）', allOf: [{$ref: '#/components/schemas/Product'}, {type: object, properties: {status: {type: string, enum: [active, offline, draft], description: '0.6.46：增 draft（草稿；新建恒为草稿，买家侧不可见）'}, cost_jpy: {type: integer}, title_ja: {type: string}, jan_code: {type: string}, purchase_source: {type: string}, updated_at: {type: string, format: date-time, description: '商品**信息**最后被改的时刻（0.6.18：不含库存变动——下单扣减与取消/关单回补都不刷新它）。同时是 `PUT /admin/products/{id}` 的乐观锁凭据（`expected_updated_at`）与管理端列表的排序键'}}}]}
    ProductInput: {type: object, required: [title, category, price_jpy, weight_g, customs_desc_en, origin_country, hs_code], properties: {title: {type: string, maxLength: 255}, category: {type: string, pattern: '^[a-z][a-z0-9_]{1,31}$', description: '0.6.74（AJ-491）：分类键，须在 /admin/categories 里存在（否则 40001，data.reason = category_unknown）'}, description: {type: string}, images: {type: array, items: {$ref: '#/components/schemas/ImageSet'}}, price_jpy: {type: integer, minimum: 1}, cost_jpy: {type: integer, minimum: 0, description: '0.6.83：上界 = MAX_ORDER_JPY（与售价同一上界）；超出 40001 cost_too_large，data.limit 带上限'}, weight_g: {type: integer, minimum: 1, maximum: 29000, description: '上限 shared PRODUCT_MAX_WEIGHT_G（为包材留余量，超出 40001 weight_too_large）'}, stock: {type: integer, minimum: 0, maximum: 2147483647, description: '0.6.83：上限 2147483647（shared PRODUCT_MAX_STOCK，products.stock INT）；超出 40001 stock_too_large。可选（0.6.9/AJ-175）：POST 省略 = 0；PUT 省略 = 不改库存（防编辑页打开期间的买家扣减被旧值覆盖）。填了就必须是 ≥0 整数，否则 40001'}, compliance_tags: {type: array, items: {type: string, enum: [liquid, battery, cosmetic, food, flammable, aerosol, electrical, quasi_drug, sunscreen, children_product, alcohol]}, description: 'flammable / aerosol / electrical / quasi_drug / sunscreen / children_product / alcohol 七个标签上架即拒（40001）：前两者为日本邮便航空禁寄品（D-42），electrical 为 MVP 不上电器（D-45），quasi_drug（医薬部外品/薬用）与 sunscreen（SPF）在美国 FDA 口径属 OTC 药品、children_product 需 CPSIA 检测、alcohol 需酒类免许且不可邮寄（D-51）；customs_desc_en 含 medicated/whitening/SPF/sunscreen/drug 亦拒（0.6.89：按**词首**匹配，SPF50+ / sunscreens / drugs 亦命中，规则在 shared customs.ts，服务端与管理端同一份）'}, hs_code: {type: string, maxLength: 16, pattern: '^\d+(\.\d+)*$', description: '0.6.89：形状——数字，可用点号分段，数字合计 6–10 位，否则 40001 hs_code_shape（shared hsCodeShapeOk；原先只有管理端判）。0.6.37：上限 16（迁移 031，带点的美国 10 位 HTS `3304.99.5000` 可存）。报关 HS 码；0.6.31 起**所有商品必填**（缺省 / 空白 → 40001 hs_code_required）。此前仅食品/化妆品必填、其余"由 Zonos 识别"，但 Zonos 从未接入（D-39/D-42，AJ-368）'}, customs_desc_en: {type: string, maxLength: 120, description: '英文报关品名，上架必填（D-39）'}, origin_country: {type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$', enum: [JP], description: '原产地 ISO 3166-1 alpha-2，必填无默认，按商品包装实录；MVP 仅接受 JP——非 JP 一律 400 拒绝上架（D-42/D-43）'}, title_ja: {type: string, maxLength: 255, description: '日文品名（采购用）'}, jan_code: {type: string, maxLength: 13, description: 'JAN 码。0.6.85：填了就必须是 8 位或 13 位数字（shared janShapeOk），否则 40001 jan_code_shape；校验位不在服务端判（管理端只提醒）'}, purchase_source: {type: string, maxLength: 255, description: '采购渠道'},
                 why: {type: string, maxLength: 200, description: '0.6.23：编辑口径的"为什么值得买"。可选（必填会逼运营编一句假文案）；超 200 字报 40001 why_too_long，**不静默截断**'},
                 maker: {type: string, maxLength: 120, description: '0.6.23：产地 / 工房 / 匠人署名。可选；超 120 字报 40001 maker_too_long（与 DB VARCHAR(120) 同宽）'},
                 tags: {type: array, items: {type: string, minLength: 1}, description: '0.6.23：编辑展示标签。**PUT 是整行覆盖**：带了（含空数组）= 覆盖，省略在新建路径按 [] 处理；逐项不得为空串（空串会渲染出一个空色块）'}}}
    AddressInput: {description: '0.6.78（AJ-496）：美国地址邮编首位须与州一致，否则 40002。0.6.27：各字段补列宽上限（= ADDRESS_MAX_CHARS，与列宽逐字一致），超长 40001；state 补 pattern（不符是 **40002** 不是 40001）', type: object, required: [recipient, phone, line1, city, state, postal_code], properties: {recipient: {type: string, maxLength: 100, pattern: '^[ -~]+$'}, phone: {type: string, maxLength: 20, pattern: '^\+1[0-9]{10}$'}, line1: {type: string, maxLength: 200, pattern: '^[ -~]+$'}, line2: {type: string, nullable: true, maxLength: 200, pattern: '^[ -~]*$', description: '0.6.65：请求可省略或传 null；响应里没填时为 null'}, city: {type: string, maxLength: 100, pattern: '^[ -~]+$'}, state: {type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$', description: '0.6.33：country = US 时必须是 USPS Pub 28 附录 B 的 62 个州码之一（50 州 + DC + 属地 / 自由联系国 + AA/AE/AP），否则 40002（剩余清单 4-5）'}, postal_code: {type: string, maxLength: 10, pattern: '^\d{5}(-\d{4})?$'}, country: {type: string, default: US}, is_default: {type: boolean}}}
    Address: {allOf: [{$ref: '#/components/schemas/AddressInput'}, {type: object, properties: {id: {type: string}}}]}
    OrderItemsInput: {type: array, minItems: 1, maxItems: 50, description: '0.6.27：maxItems 50 = domain/quote.ts 的 MAX_QUOTE_ITEMS（AJ-319）。0.6.34 订正：原写"代码里根本没有数量上限"不成立——路由层自 AJ-107 起就有同值上限（只是 reason 不同）；现已收成一份常量。超出 → 40001（reason items_too_many，日志可见）。0.6.66 订正：小程序购物车自 P2-31 起已有品种上限（cart-store.js MAX_CART_LINES=50，第 51 种在加购时即拦）；原注释写的「没有上限、51 件才撞 40001」已过期', items: {type: object, required: [product_id, qty], properties: {product_id: {type: string}, qty: {type: integer, minimum: 1, maximum: 99, description: '0.6.66（AJ-448）：单行上限 = shared MAX_LINE_QTY；超出 → 40001 qty_too_large。小程序购物车与详情页步进同封顶'}}}}
    # duty_jpy 可空 + duty_estimate（I1-U4 实现口径）：duty_rates 无此 (origin,dest) 行、或目的国/产地
    # 无法唯一确定时 duty_jpy=null 且 duty_estimate=false——duty 本是信息字段，缺失不阻止下单（基数口径 13b 已由工程 AJ-142 定为按成交价 ×15%）。
    Quote: {type: object, properties: {items_jpy: {type: integer}, shipping_jpy: {type: integer}, duty_jpy: {type: integer, nullable: true, description: 信息字段，不计入 total（D-32）；null = 无法估算（见 duty_estimate）}, duty_estimate: {type: boolean, description: 'false 时 duty_jpy 为 null，前端不得展示具体关税数字'}, total_jpy: {type: integer}, weight_g: {type: integer, description: 含 PACKAGING_WEIGHT_G 包材重量（D-42）}, display: {$ref: '#/components/schemas/Display'}, free_shipping_remaining_jpy: {type: integer}, split_hint: {type: boolean, description: 金额超 MAX_ORDER_JPY 时为 true，提示拆单（D-42；建单时硬拦 40906）}, lines: {type: array, description: '0.6.39（三端联动模拟）：逐行当前单价，与请求 items 同序；只读展示，购物车用它刷新快照价', items: {type: object, required: [product_id, unit_price_jpy], properties: {product_id: {type: string}, unit_price_jpy: {type: integer}}}}}}
    OrderStatus: {type: string, enum: [created, pending_payment, paid, shipped, delivered, completed, cancelled, expired, refunding, refunded]}
    OrderCreated: {allOf: [{$ref: '#/components/schemas/Quote'}, {type: object, properties: {order_id: {type: string}, order_no: {type: string}, fx_snapshot: {type: object, properties: {USD: {type: number}, CNY: {type: number}}}, status: {$ref: '#/components/schemas/OrderStatus'}, expires_at: {type: string, format: date-time}}}]}
    OrderSummary: {type: object, properties: {order_id: {type: string}, order_no: {type: string}, total_jpy: {type: integer}, display: {$ref: '#/components/schemas/Display'}, status: {$ref: '#/components/schemas/OrderStatus'}, created_at: {type: string, format: date-time}}}
    BeaconEventName: {type: string, enum: [page_view, add_to_cart, checkout_enter, pay_start, pay_abandon], description: '0.6.50：事件名白名单（shared BEACON_EVENT；新增事件须同步隐私政策）'}
    BeaconPage: {type: string, enum: [home, detail, cart, checkout, pay, order, order_detail, user], description: '0.6.50：page_view 的页面键（shared BEACON_PAGE）'}
    BeaconAbandonReason: {type: string, enum: [back, cancel, fail], description: '0.6.50：pay_abandon 原因——back 离开支付页 / cancel 收银台取消 / fail 发起或收银台失败（shared BEACON_ABANDON_REASON）'}
    BeaconEvent:
      type: object
      additionalProperties: false
      required: [name, ts]
      description: '0.6.50：props 按事件名取**精确键集**——page_view {page} / add_to_cart {product_id} / checkout_enter（无 props 或 {}）/ pay_start {order_id, channel} / pay_abandon {order_id, reason}'
      properties:
        name: {$ref: '#/components/schemas/BeaconEventName'}
        ts: {type: integer, format: int64, description: 客户端 epoch 毫秒}
        props:
          type: object
          additionalProperties: false
          properties:
            page: {$ref: '#/components/schemas/BeaconPage'}
            product_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
            order_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
            channel: {type: string, description: 'x-payment-channels 登记的 key'}
            reason: {$ref: '#/components/schemas/BeaconAbandonReason'}
    BeaconBatch:
      type: object
      additionalProperties: false
      required: [anon_id, events]
      properties:
        anon_id: {type: string, pattern: '^an-[0-9A-HJKMNP-TV-Z]{20}$'}
