    0.6.27（DB 分片第五轮重读：DB2-03 余项 / DB2-04 / AJ-315 / AJ-316）——**全部是"契约比实现宽松/漏列"这一类**，无行为变更。
      ⚠️ 这一版的共同形态：实现早就这么做了（有的做了几个月），契约停在更早的口径上。
      契约宽松**不会让任何测试变红**（没有一处拿契约去校验请求），它只在"照契约写前端"那天
      变成真实缺陷——前端不拦、服务端拦，用户填完了才炸。
      ① **40907 / 40909 的文案订正**（AJ-318）：由「存在**进行中的**拒付」改为
      「存在**未解除的**拒付限制（**进行中，或已败诉**）」。
      @why 0.6.10① 起 `has_dispute` 的语义就是"未解除的限制"——败诉后保持 true，
      两个闸门**继续拦**（钱已被机构拉回）。旧文案让客服去**等结案**，
      而那张单已经结案了（lost），等下去永远不会解锁；她只会得出"系统卡住了"，
      不会想到"这笔钱已经被拉回、要先处理争议"。文案与事实不符按 bug 算（ADR-29），
      且这个方向是把人引向等待。`action` 同步改：败诉的出口是处理争议 / 人工解除（0.6.14）。
      ② `POST /admin/orders/{id}/ship`：requestBody 补 `carrier` **maxLength 32**、
      `tracking_no` **maxLength 64**（AJ-315），并补 **200 响应体** `{order_id, status, carrier, tracking_no}`。
      @why 两列是 `VARCHAR(32)/(64)`（迁移 001），实现此前只判非空 ⇒ 超长撞 PG 22001 →
      兜底折成泛化的 40001（reason 带 `sql_data_exception:22001`），运营看到的提示**指向错误的字段**。
      现在入口拦（40001 + reason 指名哪一列），上限与前端 `maxLength` 共用 `SHIP_MAX_CHARS` 一份。
      有响应体却写成无体，按 0.6.6② 自定的口径比漏列状态码更糟。
      ③ `POST /auth/wechat/login` 的 `code` 补 **maxLength 128**（AJ-316）。
      @why 这是**无鉴权**入口，code 是客户端唯一可控的输入，且会被原样拼进发往微信的查询串。
      取值是"真实 js_code 约 32 字符 + 4 倍余量"，⚠️ 真微信 code 的长度**未见官方声明**。
      ④ `OrderItemsInput` 补 **maxItems 50**（实现 `MAX_QUOTE_ITEMS`，超了 40001）；
      `contact_email` 补 **maxLength 255**；`AddressInput` 各字段补 **maxLength**
      （`ADDRESS_MAX_CHARS`：recipient 100 / phone 20 / line1 200 / line2 200 / city 100 / postal_code 10），
      `state` 补 **pattern `^[A-Z]{2}$`**（不符是 40002 不是 40001）。
      ⑤ **出站路径补 503 / 50300**：熔断打开时 `errors.ts` 把 `CircuitOpenError` 映射成
      50300（HTTP 503 + `retry_after_ms`），而它此前只登记在 `/readyz` 与回调上。
      逐条核对调用链后，实际会出站的**五条**路径是：
      `POST /orders/{id}/pay`（建会话）、`POST /orders/{id}/cancel`（`assertNoPaidSession`
      问机构"付了没有"，问不到 fail-closed 直接 50300，**不是**"查不到就当没付"）、
      `POST /auth/wechat/login`（code2session）、`POST /admin/orders/{id}/refund`（机构退款，AJ-313）、
      `POST /admin/upload`（对象存储 R2）。
      ⚠️ 别把这里的 503 与 `POST /pay/callback/{channel}` 的 503 混为一谈：回调那个是
      **业务语义**（"单不存在且在宽限期内 → 让机构重发"），本条的 503 是**熔断**语义。
      ⑥ `POST /orders/{id}/cancel` 的状态码此前只登记 `200 / 409`，而代码实际还会回
      400 / 401 / 403 / 404（40400：不存在**或非本人**同码，防存在性探测）/ 500 / 503；
      `POST /auth/wechat/login` 此前缺 400（code 校验）与 500（50000 未配置 AppID）。
      📌 已知仍缺（不在本版）：`AdminOrder.payments[]` 实回的 `created_at`、
      `/internal/jobs/daily` 的 summary（已漂到四项）、`/auth/admin/login` 的 email/password maxLength。
