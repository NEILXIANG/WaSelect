<!--
  链接失效页：/pay/link（I1）在校验失败/订单已关闭/链接过期时 302 到这里。
  __BRAND_NAME__ 由构建期替换。
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>链接已不能付款 – __BRAND_NAME__</title>
    <link rel="stylesheet" href="/assets/tokens.css" />
    <link rel="stylesheet" href="/assets/page.css" />
  </head>
  <body>
    <main class="card">
      <svg class="icon muted" viewBox="0 0 56 56" fill="none" aria-hidden="true">
        <circle cx="28" cy="28" r="26" stroke="currentColor" stroke-width="3" />
        <path
          d="M28 16v12l8 6"
          stroke="currentColor"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <h1>这个链接已不能付款</h1>
      <p>
        这张订单可能已经付款成功，也可能已关闭或超过付款时间。<br />
        请回到微信「__BRAND_NAME__」小程序，在「订单」里查看它的最新状态；确认没有付款成功再重新下单。
      </p>
      <p class="footer">本页面可以安全关闭</p>
    </main>
  </body>
</html>
