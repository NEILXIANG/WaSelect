# 依赖自动升级（上线前自动化方案 2026-10-16）。
#
# @why 一个人维护的项目，依赖升级最容易被无限期搁置，直到某个 CVE 逼着一次升几十个包。
#      让机器每周开 PR，CI（npm run gate）绿了再合——每次只合一小步，出问题能定位到是哪个包。
# @why 补丁与次版本**合成一个 PR**：一周一个 PR 看得过来；主版本单独开（可能有破坏性改动，要人读 changelog）。
# @why 也盯 GitHub Actions：actions/checkout 这类也会出安全修复，且不在 npm 的视野里。
# @limitation Dependabot 不会自动合并：合并仍要人点（或另配 auto-merge 规则）。刻意不配自动合并——
#            gate 绿只说明现有测试没红，依赖升级引入的行为变化不一定有测试覆盖。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    labels: ['dependencies']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    labels: ['dependencies']
