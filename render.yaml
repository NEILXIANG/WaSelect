# Render 部署清单（F16）——Infrastructure as Code。
#
# @why 部署配置最容易出的失效不是"配错了"，而是"**代码新增了一个必填变量，平台上没配**"：
#      本机永远发现不了（本机 .env 里有），只在部署后启动失败时才暴露——那已经是一次失败的发布。
#      所以这个文件是**受门禁约束**的：test/config/render-env.unit.test.ts 会做三个集合比对
#      （必填项是否都列了 / 这里列的键代码认不认得 / 密钥有没有被写死进来）。
#      改这个文件之前先看那个测试的报错，它会直接告诉你缺哪个键。
#
# ⚠️ 密钥一律 `sync: false`（在 Render 控制台填），**绝不写 value**——
#    本文件是提交进仓库的，写进来等于把密钥交给所有能读仓库的人（含 CI 日志）。
#
# @see .env.example（变量名与含义的唯一真源）、docs/地基搭建清单.md F16

services:
  - type: web
    name: waselect-api
    runtime: node
    region: oregon # 美西 Oregon（ADR-13）：日本 ↔ 美西的往返比东京↔弗吉尼亚短一个量级
    # 三审：`starter` 不是 Blueprint 规范里的档位名（合法值形如 `0.5c-512mb` / `1c-2g`，
    #    render.com/docs/blueprint-spec 2026-09-25 核对）。取最小付费档；**禁免费档**：
    #    免费档会冷启动（首个请求可能几十秒），支付回调在这种延迟下会被机构判超时并重发，
    #    而重发正是幂等要兜的东西——拿免费档省下的钱去冒这个险不划算。价格以控制台为准。
    plan: 0.5c-512mb
    branch: main
    # ⚠️ 这里必须是全量 `npm ci`（含 devDependencies），不能 `--omit=dev`：
    #    build 要调 tsc / vite（都是 devDependencies），省了装不上就直接构建失败。
    #    "只跑生产依赖"由 Render 的 start 阶段天然保证——start 只是 `node server/dist/main.js`，
    #    dev 依赖装了也只是躺在 node_modules 里不进运行路径（代价是构建镜像稍大，换来的是不用维护两份依赖清单）。
    #    `npm run build` 编译 shared + server + admin-web（start 跑的是 server/dist）
    #    ⚠️ 必须 `--include=dev`（全量审计 2026-09-26 P1）：本清单把 NODE_ENV=production 注入到构建期，
    #    而 npm 在 NODE_ENV=production 下默认 `omit=dev`——@measured：`NODE_ENV=production npm ci` 装出
    #    0 个包、`--include=dev` 才装出 devDependencies。没有它 tsc / vite / node-pg-migrate 全都不在，
    #    构建必失败（或迁移命令找不到工具）。
    buildCommand: npm ci --include=dev && npm run build
    # 发布前先跑迁移（全量审计 2026-09-26 P1：此前生产没有任何迁移执行点，服务能起来但表/列不存在）。
    # Blueprint 字段名 `preDeployCommand`（NEEDS VERIFICATION：以 render.com/docs/blueprint-spec 为准；
    # 若平台不认此字段，退路是 `startCommand: npm run db:migrate && npm start`，代价是每个实例都跑一次迁移）
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    # ⚠️ 健康检查刻意用 /healthz（存活）而**不是** /readyz（就绪）。
    #    /readyz 在停机摘流期间会转 503，若被平台当作健康依据，
    #    正在排空在途请求的实例会被判定不健康而**提前杀掉**——恰好毁掉 SHUTDOWN_READY_DELAY_MS 要保护的那段窗口。
    #    /readyz 保留给人工排查与外部观测。⚠️ 这条属平台行为，需 L4 在真平台上验一次。
    healthCheckPath: /healthz
    # 常驻调度器跑在 web 进程内（D-43）。**刻意 1 个实例**：多实例不是"多跑几次"，
    # 而是两个进程抢同一把 advisory lock（安全但浪费），且订单超时关单这类 job 的触发时机变得不可预测。
    # 要扩容前必须先把调度器拆成独立进程，否则每加一个实例就多一个空转的调度器。
    numInstances: 1
    envVars:
      # ── 运行环境 ──────────────────────────────────────────────
      # ⚠️ 必须显式写 production：schema 默认值是 development，
      #    漏配的后果是**生产跨字段校验全部不生效**（https 要求、必填要求、CORS 要求全跳过），
      #    而且服务照样起得来、照样能下单——是一类"看起来一切正常"的错。
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0 # 容器平台从宿主机外部探端口，绑回环会导致健康检查超时/发布失败
      - key: TRUST_PROXY_HOPS
        value: 1 # Render 前置一层反代（D23）。必须是层数，不是 true
      - key: DATABASE_URL
        fromDatabase:
          name: waselect-pg
          property: connectionString

      # ── 出站 HTTP（F12：这三个数字是运营参数，调它不该发版）──────
      - key: HTTP_TIMEOUT_MS
        value: 10000
      # ⚠️ 总预算必须与单次超时**分开看**：只设单次超时的后果是 10s × 3 次 = 30s，
      #    那会挂死同步链路。预算存在的唯一理由就是比它更短。
      - key: HTTP_TOTAL_BUDGET_MS
        value: 6000
      # ⚠️ 阈值必须大于重试次数（3），否则一次请求就把上游判死——熔断与重试成了同一件事
      - key: CB_FAILURE_THRESHOLD
        value: 5
      - key: CB_COOLDOWN_MS
        value: 30000
      - key: CB_HALF_OPEN_PROBES
        value: 1

      # ── 密钥（`sync: false`：在控制台填，不进仓库）────────────
      - key: JWT_SECRET
        sync: false # openssl rand -hex 32；≥32 字符
      - key: MOCK_CALLBACK_SECRET
        sync: false # 审核期专用。**独立于 JWT_SECRET**（泄露半径与轮换周期不同，P1-4）
        #           ⚠️ 审核期结束、PAYMENT_CHANNELS 去掉 mock 时必须在控制台**删除**此值：
        #           生产残留会被配置层拒启（config.ts 规则 1b，三审 S1），不是可选清理
      - key: ADMIN_INITIAL_PASSWORD
        sync: false # ≥12 位；首次登录后应改密。seed 时 bcrypt 写入 users.password_hash

      # ── 业务口径 ──────────────────────────────────────────────
      - key: TERMS_VERSION
        value: TOS-2026-09-20 # 建单必传且必须相等（40011）；改它等于让所有旧客户端下单失败，是有意的行为
      # 审核期只开 mock（AJ-30：真实通道必须离线，防止测试下单产生真实扣款）。
      # R1（收单机构事前相談）通过后再改这里加 wechat——**改配置不改代码**，这正是通道可插拔的目的。
      - key: PAYMENT_CHANNELS
        value: mock
      - key: REVIEW_MODE
        value: on
      - key: REVIEW_SKU_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false # 生产必填（跨字段校验会拦）；只放行 admin-web 域名
      - key: ADMIN_OPENIDS
        sync: false # 逗号分隔；首次登录时写入 users.is_admin
      - key: ADMIN_EMAIL
        sync: false
      - key: PUBLIC_API_BASE
        sync: false # 小程序 request 合法域名（微信后台每月仅可改 5 次，开局一次性规划）

      # ── 占位：有的已接线（CHECKOUT_BASE_URL / INTERNAL_JOB_SECRET / IMG_BASE_URL / STRIPE_*），
      #    有的尚无使用方（R2_* / MAIL_* / SUBSCRIBE_* / WECHAT_INSTITUTION_* / SENTRY_DSN）——
      #    是否接线以 server/src/config.ts 的使用方为准（一致性审计 C9，AJ-176 更正原"尚未接线"一句）──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CHECKOUT_BASE_URL
        sync: false # 短链域名（D-49）；启用 stripe 时生产必填
      - key: INTERNAL_JOB_SECRET
        sync: false # 每日作业共享密钥（≥32 字符）；下方 cron 服务经 fromService 取同一个值
      - key: SENTRY_DSN
        sync: false
      - key: IMG_BASE_URL
        sync: false # 商品图必须走 R2 + CDN（Render egress 仅 5GB/月，不能由应用出图片流量）
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: MAIL_PROVIDER_API_KEY
        sync: false
      - key: SUBSCRIBE_TMPL_PAID
        sync: false
      - key: SUBSCRIBE_TMPL_SHIPPED
        sync: false
      - key: SUBSCRIBE_TMPL_DELIVERED
        sync: false
      - key: APP_ID
        sync: false # 小程序 AppID（境外主体注册后取得）
      - key: APP_SECRET
        sync: false
      - key: WECHAT_INSTITUTION_MERCHANT_ID
        sync: false
      - key: WECHAT_INSTITUTION_API_KEY
        sync: false

  # ── 每日作业（D-43③ / 技术文档 §6.1 / 工程框架文档：「1 个每日 Cron Job」）──────────────
  # @why 每日对账、调度心跳看门狗（0.5.4 起 /healthz 不再承担）、卡住的回调（KD-2）都只由
  #      POST /api/v1/internal/jobs/daily 触发。本清单曾只有 web + db（一致性审计 C1，AJ-176）：
  #      生产上这些检查**永不执行**，tick 停摆没有任何告警。
  # @measured(render.com/docs/blueprint-spec, 2026-09-28)：cron 服务字段 type/name/runtime/schedule/
  #      buildCommand/startCommand；plan 缺省 0.5c-512mb；`fromService.property` 取值含 host / port / hostport。
  # @measured(render.com/docs/private-network, 2026-09-28)：「Workflows, background workers, and cron jobs can
  #      *send* private network requests」；web 服务可接收；地址需带协议（http://<host>:<port>）。私网只在同区域可达。
  # @measured(本地桩服务，2026-09-28，同一条 startCommand)：202 → 打印「daily job HTTP 202」exit 0；
  #      401 → exit 1；地址不可达 → exit 1（非 0 退出让 Render 把这次作业标成失败，控制台可见）。
  # @limitation 发现延迟 = 一天一轮（tick 停摆最迟约 24 小时才被看见）；要更快需另起高频作业。
  # @limitation 私网请求不经公网 TLS，由共享密钥头鉴权（x-internal-job-secret，≥32 字符，恒定时间比较）。
  - type: cron
    name: waselect-daily
    runtime: node
    region: oregon # 必须与 web 同区域：私网跨区域不可达
    plan: 0.5c-512mb
    schedule: '10 18 * * *' # UTC 18:10 = JST 03:10（低峰）；分钟避开整点拥挤
    branch: main
    buildCommand: 'true' # 不装依赖：只发一个 HTTP 请求（Node 22 自带 fetch）
    startCommand: >-
      node -e "fetch('http://' + process.env.DAILY_JOB_TARGET + '/api/v1/internal/jobs/daily',
      {method: 'POST', headers: {'x-internal-job-secret': process.env.INTERNAL_JOB_SECRET}})
      .then((r) => { console.log('daily job HTTP', r.status); if (r.status !== 202) process.exit(1); })
      .catch((e) => { console.error(e); process.exit(1); })"
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: INTERNAL_JOB_SECRET
        fromService:
          type: web
          name: waselect-api
          envVarKey: INTERNAL_JOB_SECRET
      - key: DAILY_JOB_TARGET
        fromService:
          type: web
          name: waselect-api
          property: hostport

databases:
  - name: waselect-pg
    region: oregon # 与 web 同区：跨区会把每个查询的 RTT 加几十毫秒，且**按 egress 计费**
    # 三审：`starter` 不是 Blueprint 规范里的档位名；数据库合法档位形如 `0.1c-256mb` / `0.5c-1g`。
    #    取最小付费档；**禁免费档**（`free` / 30 天过期）：数据是唯一不能重建的东西。价格以控制台为准。
    plan: 0.5c-1g
    # ⚠️ 键名是 `postgresMajorVersion`（字符串），**不是** `postgresVersion`（三审 P2-1）：
    #    写错键名的后果不是报错，而是被忽略并建出**平台默认版本**的库——代码闸门
    #    assertPostgresMajor(>=16) 会放行，但 CI（PG16）与生产版本从此不一致。
    #    test/config/render-env.unit.test.ts 现在会校验 databases 段的键名集合。
    postgresMajorVersion: '16' # 代码里有硬闸门 assertPostgresMajor(>=16)，版本不符直接启动失败
    # ⚠️ 库名**必须**带 `_prod` 且与开发默认库名（`japan_shop`）不同（全量审查 B31，2026-09-29）：
    #    同名会让 `scripts/seed-lib.ts` 的两道闸门同时失效——① 只挡非 localhost，而"把生产库
    #    端口转发到 localhost:15432 排查问题"是常规操作，转发后 host 就是 localhost；
    #    ② "库名含 prod 就拒"因为名字里没有 prod 而永远不触发。两者叠加的结果是
    #    `npm run db:seed`（默认 TRUNCATE 全部业务表）可以对着生产库跑且一路绿灯。
    #    ⚠️ **Render 建库后此值不可再改**（只能新建库再迁数据），所以必须在这里一次改对。
    databaseName: japan_shop_prod
    user: waselect
